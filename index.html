<style>
:root{
  --bg:#0d1117; --bg2:#131a23; --panel:#161d27; --panel2:#1c2530; --line:#242e3b;
  --tx:#e6edf3; --tx2:#8b98a9; --tx3:#5d6b7d;
  --ac:#4a9eff; --ac2:#1f6feb;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#a371f7;
  --r:10px; --sh:0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2b3644;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3a4757}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(1200px 600px at 20% -10%, #16283f 0%, transparent 60%),
  radial-gradient(900px 500px at 90% 110%, #1b2a1f 0%, transparent 55%), var(--bg);z-index:100}
.login-card{width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 34px;box-shadow:var(--sh)}
.login-card h1{font-size:21px;letter-spacing:-.4px;margin-bottom:4px}
.login-card .sub{color:var(--tx2);font-size:13px;margin-bottom:26px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;transition:border-color .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ac)}
.btn{background:var(--ac2);border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;transition:filter .15s;color:#fff}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.w{width:100%}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.gh:hover{background:var(--panel2);filter:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.dg{background:var(--bad)}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.msg.err{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.35);color:#ffb3ae;display:block}
.msg.ok{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.35);color:#8ce39a;display:block}

/* ---------- SHELL ---------- */
#app{display:none;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand{padding:18px 16px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;
  cursor:pointer;transition:background .15s;user-select:none}
.brand:hover{background:var(--panel)}
.brand:hover svg{color:var(--ac)}
.brand svg{width:29px;height:29px;flex:none;color:var(--tx2);transition:color .15s}
.brand b{display:block;font-size:15.5px;letter-spacing:.5px;font-weight:700}
.brand span{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px}
.brand span b{display:inline;font-size:10.5px;letter-spacing:.7px;color:var(--tx2)}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--tx2);font-size:13.5px;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:var(--panel);color:var(--tx)}
.nav a.on{background:rgba(74,158,255,.14);color:var(--ac);font-weight:600}
.nav a i{width:18px;text-align:center;font-style:normal;opacity:.85}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);padding:14px 12px 6px;font-weight:600}
.who{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.who b{color:var(--tx);display:block;font-size:12.5px}
.main{margin-left:230px;padding:24px 28px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.head h2{font-size:20px;letter-spacing:-.4px}
.head p{color:var(--tx2);font-size:13px;margin-top:3px;max-width:70ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- COMPONENTES ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card .lb{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px}
.card .vl{font-size:23px;font-weight:650;letter-spacing:-.6px}
.card .ft{font-size:11.5px;color:var(--tx3);margin-top:5px}
.card.ok .vl{color:var(--ok)} .card.warn .vl{color:var(--warn)} .card.bad .vl{color:var(--bad)} .card.info .vl{color:var(--info)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden}
.panel .ph{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel .ph h3{font-size:14px;font-weight:600}
.panel .ph .sub{font-size:12px;color:var(--tx3);font-weight:400}
.panel .pb{padding:18px}
.panel .pb.flush{padding:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:var(--panel2);color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:9px 14px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:rgba(255,255,255,.022)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.scroll{overflow:auto;max-height:62vh}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px}
.t-ok{background:rgba(63,185,80,.15);color:var(--ok)}
.t-warn{background:rgba(210,153,34,.15);color:var(--warn)}
.t-bad{background:rgba(248,81,73,.15);color:var(--bad)}
.t-info{background:rgba(163,113,247,.15);color:var(--info)}
.t-mut{background:rgba(139,152,169,.14);color:var(--tx2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .fld{margin:0;min-width:150px}
.empty{padding:44px 20px;text-align:center;color:var(--tx3);font-size:13px}
.load{padding:30px;text-align:center;color:var(--tx2);font-size:13px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.pos{color:var(--ok)} .neg{color:var(--bad)} .mut{color:var(--tx3)}
.steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:10px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--tx3)}
.step.on{border-color:var(--ac);color:var(--ac);background:rgba(74,158,255,.08)}
.step.done{border-color:var(--ok);color:var(--ok)}
.step b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;opacity:.75}
.drop{border:2px dashed var(--line);border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg2)}
.drop:hover,.drop.over{border-color:var(--ac);background:rgba(74,158,255,.05)}
.drop b{display:block;font-size:15px;margin-bottom:6px}
.drop span{color:var(--tx2);font-size:12.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:88vh;overflow:auto;box-shadow:var(--sh)}
.modal .mh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);z-index:3}
.modal .mb{padding:22px}
.x{background:none;border:none;color:var(--tx2);font-size:22px;cursor:pointer;line-height:1}
.x:hover{color:var(--tx)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px}
.kv dt{color:var(--tx2)} .kv dd{font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:20px}
.tl .it{position:relative;padding-bottom:16px}
.tl .it::before{content:'';position:absolute;left:-27px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--panel)}
.tl .it.neg::before{background:var(--bad)} .tl .it.pos::before{background:var(--ok)} .tl .it.adj::before{background:var(--warn)}
.tl .dt{font-size:11.5px;color:var(--tx3)}
.tl .ds{font-size:13px;margin-top:2px}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);margin-bottom:9px;align-items:flex-start}
.alert .ic{font-size:16px;line-height:1.2}
.alert .tt{font-size:13px;font-weight:600;margin-bottom:2px}
.alert .ms{font-size:12.5px;color:var(--tx2)}
.hint{background:rgba(74,158,255,.07);border:1px solid rgba(74,158,255,.22);border-radius:9px;padding:12px 14px;font-size:12.5px;color:var(--tx2);margin-bottom:16px}
.hint b{color:var(--tx)}
.chartbox{height:270px;position:relative}
.cnLinha{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cnLinha:last-child{border-bottom:0}
.cnLinha .cresce{flex:1}
.busca{padding:12px 12px 6px;position:relative}
.busca input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;outline:none}
.busca input:focus{border-color:var(--ac)}
.gres{position:absolute;left:12px;right:12px;top:46px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--sh);max-height:60vh;overflow:auto;z-index:60;display:none}
.gres.on{display:block}
.gres .it{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.gres .it:last-child{border-bottom:none}
.gres .it:hover,.gres .it.sel{background:var(--panel2)}
.gres .t1{font-size:12.5px;font-weight:600}
.gres .t2{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gres .tp{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3)}
.sec{margin-bottom:18px}
.sec h3{font-size:13px;margin-bottom:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
@media(max-width:900px){.side{width:60px}.side .brand div,.side .nav a span,.side .who div{display:none}.main{margin-left:60px;padding:16px}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>X-RAY</h1>
    <div class="sub">Monitoramento, auditoria e rastreabilidade de estoque — Filial 114</div>
    <div id="lgmsg" class="msg"></div>
    <div class="fld"><label>E-mail</label><input id="lgmail" type="email" autocomplete="username" placeholder="seu@email.com"></div>
    <div class="fld"><label>Senha</label><input id="lgpass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn w" id="lgbtn">Entrar</button>
    <div style="text-align:center;margin-top:14px">
      <a id="lgnew" style="font-size:12.5px;cursor:pointer">Primeiro acesso — criar minha conta</a>
    </div>
  </div>
</div>

<div id="app">
  <aside class="side">
    <div class="brand" id="brandHome" title="Voltar ao início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.6 20.4 7v10L12 21.4 3.6 17V7z"/>
        <path d="M3.6 7 12 11.4 20.4 7M12 11.4v10" opacity=".45"/>
        <circle cx="11.4" cy="10.6" r="3.1"/>
        <path d="m13.7 12.9 2.6 2.6"/>
      </svg>
      <div><b>X-RAY</b><span>Estoque · Filial 114 · <b id='ver'>v5.0</b></span></div>
    </div>
    <div class="busca"><input id="gbusca" autocomplete="off" placeholder="Buscar produto, lote ou NF…">
      <div class="gres" id="gres"></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><div><b id="whoName">—</b><span id="whoRole">—</span></div><button class="btn gh sm" id="btnSair">Sair</button></div>
  </aside>
  <main class="main" id="view"></main>
</div>

<script>
/* =========================================================
   RAIO-X DO ESTOQUE — Fase 1
   Front-end sem build. Toda agregação vem pronta do PostgreSQL.
   ========================================================= */
const VERSAO = 'v5.0';
const CFG = {
  url: 'https://egshgwnnaxfvtxwvgnnh.supabase.co',
  key: 'sb_publishable_3NKwsqk08jXGBBiTRX--yw_MLNpP7Bh',
  schema: 'estoque',
  filial: '114'
};
const sb = window.supabase.createClient(CFG.url, CFG.key, {
  db:{ schema: CFG.schema },
  auth:{ persistSession:true, autoRefreshToken:true, storageKey:'raiox-estoque' } });

/* ---------- estado ---------- */
const S = { user:null, role:null, branch:null, settings:{}, tesCfop:[], reasons:[] };

/* ---------- utilidades ---------- */
const $  = s => document.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf  = (v,d=0) => (v===null||v===undefined||isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const money = v => (v===null||v===undefined||isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct = (v,d=1) => (v===null||v===undefined||isNaN(v)) ? '—' : Number(v).toFixed(d).replace('.',',')+'%';
const dt  = v => !v ? '—' : new Date(v+(String(v).length<=10?'T12:00:00':'')).toLocaleDateString('pt-BR');
const dts = v => !v ? '—' : new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const sgn = v => v>0 ? 'pos' : v<0 ? 'neg' : 'mut';
const toast = (m,t='ok') => {
  const n = el(`<div style="position:fixed;bottom:22px;right:22px;z-index:400;background:var(--panel);border:1px solid var(--${t==='err'?'bad':'ok'});border-radius:10px;padding:13px 18px;font-size:13px;box-shadow:var(--sh);max-width:420px">${esc(m)}</div>`);
  document.body.appendChild(n); setTimeout(()=>n.remove(), t==='err'?7000:4000);
};
const modal = (title, body, wide) => {
  const m = el(`<div class="modal"><div class="box"${wide?' style="width:min(1150px,100%)"':''}>
    <div class="mh"><h3 style="font-size:15px">${esc(title)}</h3><button class="x">&times;</button></div>
    <div class="mb"></div></div></div>`);
  m.querySelector('.mb').innerHTML = body;
  m.querySelector('.x').onclick = () => m.remove();

/* A API do Supabase devolve no máximo 1000 linhas por requisição. Pedir .limit(3000)
   não dá erro: ela simplesmente entrega 1000 e o total somado na tela sai menor que
   o real, sem nenhum aviso. Toda listagem grande passa por aqui. */
// mesma paginação para funções do banco: uma função que devolve 1.120 linhas
// entrega só 1.000, e as últimas somem da tela sem qualquer aviso
const rpcAll = async (nome, args = {}, passo = 1000) => {
  let tudo = [], ini = 0;
  for(;;){
    const { data, error } = await sb.rpc(nome, args).range(ini, ini + passo - 1);
    if(error) throw error;
    tudo = tudo.concat(data || []);
    if(!data || data.length < passo) return tudo;
    ini += passo;
    if(ini > 100000) return tudo;
  }
};

const fetchAll = async (build, passo = 1000) => {
  let tudo = [], ini = 0;
  for(;;){
    const { data, error } = await build().range(ini, ini + passo - 1);
    if(error) throw error;
    tudo = tudo.concat(data || []);
    if(!data || data.length < passo) return tudo;
    ini += passo;
    if(ini > 100000) return tudo;
  }
};

/* Rede corporativa costuma bloquear CDN. Sem isto, uma biblioteca que não carrega
   deixa a tela muda: o usuário arrasta o arquivo e simplesmente nada acontece. */
const ensureLib = (cond, urls, nome) => new Promise((res, rej) => {
  if(cond()) return res();
  let i = 0;
  const proximo = () => {
    if(i >= urls.length) return rej(new Error(`Não consegui carregar a biblioteca ${nome}. `
      + `Sua rede provavelmente bloqueia o CDN — teste em outra conexão ou libere jsdelivr.net.`));
    const sc = document.createElement('script'); sc.src = urls[i++];
    sc.onload = () => cond() ? res() : proximo();
    sc.onerror = proximo;
    document.head.appendChild(sc);
  };
  proximo();
});

/* Busca global: um campo só para chegar em qualquer item, por código, descrição,
   lote ou número de nota. Tudo desemboca na mesma página — o Raio-X do produto. */
function ligarBuscaGlobal(){
  const inp = $('#gbusca'), cx = $('#gres');
  if(!inp || inp.dataset.on) return;
  inp.dataset.on = '1';
  let timer, achados = [], sel = -1;

  const fechar = () => { cx.classList.remove('on'); sel = -1; };
  const abrir = () => {
    if(!achados.length){ cx.innerHTML = '<div class="it"><div class="t2">Nada encontrado.</div></div>'; }
    else cx.innerHTML = achados.map((r,i)=>`<div class="it${i===sel?' sel':''}" data-i="${i}">
      <div class="tp">${esc(r.tipo)}</div>
      <div class="t1">${esc(r.titulo)}</div>
      <div class="t2">${esc(r.subtitulo||'')}${r.extra?' · '+esc(r.extra):''}</div></div>`).join('');
    cx.classList.add('on');
    cx.querySelectorAll('.it[data-i]').forEach(d => d.onclick = () => ir(Number(d.dataset.i)));
  };
  const ir = i => { const r = achados[i]; if(!r) return;
    inp.value = ''; fechar(); location.hash = 'produto?id=' + r.id; };

  inp.oninput = () => {
    clearTimeout(timer);
    const q = inp.value.trim();
    if(q.length < 2) return fechar();
    timer = setTimeout(async () => {
      const { data, error } = await sb.rpc('fn_busca_global', { p_termo:q, p_limite:25 });
      if(error) return err(error);
      achados = data || []; sel = achados.length ? 0 : -1; abrir();
    }, 280);
  };
  inp.onkeydown = e => {
    if(!cx.classList.contains('on')) return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel+1, achados.length-1); abrir(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel-1, 0); abrir(); }
    else if(e.key === 'Enter'){ e.preventDefault(); ir(sel < 0 ? 0 : sel); }
    else if(e.key === 'Escape') fechar();
  };
  document.addEventListener('click', e => { if(!e.target.closest('.busca')) fechar(); });
}

      <td class="num">${nf(r.qtd_atual)}</td><td class="num">${money(r.valor_atual)}</td>
      <td class="num">${nf(r.dias_sem_movimento)}</td><td>${dt(r.data_ultimo_inventario)}</td>
      <td>${r.lote_pai ? `<span class="tag t-info" title="Fracionado de ${esc(r.lote_pai)} em ${dt(r.fracionado_em)}">de ${esc(r.lote_pai)}</span>`
            : r.lotes_filhos > 0 ? `<span class="tag t-mut">${nf(r.lotes_filhos)} fracionamento(s)</span>` : ''}</td>
      <td>${(can('admin','auditor') && Number(r.qtd_atual) > 0)
            ? `<button class="btn sm gh" onclick="desmontar('${r.lot_id}','${esc(r.sku)}','${esc(r.numero_lote)}',${r.qtd_atual},'${esc(r.unidade||'')}','${r.product_id}')">Desmontar</button>`
            : ''}</td>
    </tr>`).join('') : '<tr><td colspan="13" class="empty">Nenhum lote encontrado.</td></tr>';
  };
  draw(); ['q','dmin','tp'].forEach(i => { $('#'+i).oninput = draw; $('#'+i).onchange = draw; });
  $('#exp').onclick = () => toXlsx(data.map(r=>({Codigo:r.sku,Descricao:r.descricao,Lote:r.numero_lote,Armazem:r.armazem,
    Entrada:r.data_entrada,DiasEmEstoque:r.dias_em_estoque,Saldo:r.qtd_atual,Valor:r.valor_atual,
    DiasSemMovimento:r.dias_sem_movimento,UltimoInventario:r.data_ultimo_inventario,
    FracionadoDe:r.lote_pai,FracionadoEm:r.fracionado_em,Fracionamentos:r.lotes_filhos})), 'lotes-idade.xlsx');
};

/* Desmontagem de lote: ao fracionar uma bobina, a parte cortada vira um lote
   com número próprio para não se misturar de volta ao original. O saldo do
   produto não muda — é transferência interna, com dois movimentos no Kardex. */
/* Desmontagem: a bobina é desmembrada por inteiro nos lances informados.
   A única regra é a soma fechar com o saldo de origem — nem mais, nem menos.
   Os números de lote são os que o usuário digitar; se já existirem no produto,
   o material entra neles em vez de a operação ser recusada. */
window.desmontar = async (lotId, sku, numeroLote, saldo, unidade, productId) => {
  const usados = productId
    ? await sb.rpc('fn_lotes_do_produto', { p_product: productId }).then(r => r.data || [])
    : [];

  const m = modal(`Desmontar lote — ${sku}`, `
    <div class="hint">O lote <b>${esc(numeroLote)}</b> será desmembrado por inteiro nos lances abaixo e ficará zerado.
    A soma dos lances tem que dar exatamente <b>${nf(saldo)} ${esc(unidade)}</b>.
    <br>Os lotes novos herdam a data de entrada da origem — cortar não rejuvenesce o material.</div>

    <dl class="kv" style="margin-bottom:14px">
      <dt>Produto</dt><dd class="mono">${esc(sku)}</dd>
      <dt>Lote de origem</dt><dd class="mono">${esc(numeroLote)}</dd>
      <dt>Saldo a desmembrar</dt><dd>${nf(saldo)} ${esc(unidade)}</dd>
      ${usados.length?`<dt>Lotes já usados</dt><dd style="font-weight:400">${usados.map(l=>
        `<span class="tag ${Number(l.saldo)>0?'t-ok':'t-mut'}" title="${Number(l.saldo)>0?'saldo '+nf(l.saldo):'zerado'}">${esc(l.numero_lote)}</span>`).join(' ')}
        <div style="font-size:11.5px;color:var(--tx3);margin-top:5px">Se repetir um destes, o material entra no lote existente.</div></dd>`:''}
    </dl>

    <div class="panel" style="margin-bottom:12px"><div class="pb flush">
      <table><thead><tr><th style="width:55%">Número do lote</th><th class="num">Quantidade</th><th style="width:44px"></th></tr></thead>
      <tbody id="dmLinhas"></tbody></table>
    </div></div>

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn gh sm" id="dmAdd">+ Acrescentar lance</button>
      <button class="btn gh sm" id="dmResto">Completar com o que falta</button>
      <div id="dmSoma" style="margin-left:auto;font-size:13px"></div>
    </div>

    <div class="fld"><label>Motivo</label>
      <input id="dmMotivo" value="Desmontagem de bobina"></div>
    <div class="fld"><label>Observação</label><textarea id="dmObs" rows="2" placeholder="opcional"></textarea></div>
    <button class="btn" id="dmOk" disabled>Desmontar lote</button>`, true);

  const $$ = q => m.querySelector(q);
  const linhas = () => [...m.querySelectorAll('#dmLinhas tr')].map(tr => ({
    lote: tr.querySelector('.dmL').value.trim(),
    qtd: Number(tr.querySelector('.dmQ').value || 0), tr }));

  const somar = () => {
    const ls = linhas();
    const soma = ls.reduce((a,x)=>a+x.qtd, 0);
    const dif = Number((soma - saldo).toFixed(4));
    const semLote = ls.some(x => x.qtd > 0 && !x.lote);
    const repetidos = ls.map(x=>x.lote.toLowerCase()).filter((v,i,a)=>v && a.indexOf(v)!==i);
    const fecha = Math.abs(dif) < 0.0001 && !semLote && !repetidos.length && ls.length > 0;

    $$('#dmSoma').innerHTML = fecha
      ? `<span class="tag t-ok">soma ${nf(soma)} — fecha com a origem</span>`
      : repetidos.length ? `<span class="tag t-bad">lote repetido nos lances: ${esc(repetidos[0])}</span>`
      : semLote ? `<span class="tag t-bad">há lance sem número de lote</span>`
      : `<span class="tag ${dif<0?'t-warn':'t-bad'}">soma ${nf(soma)} de ${nf(saldo)} · ${dif<0?'faltam '+nf(-dif):'excedeu '+nf(dif)}</span>`;

    $$('#dmOk').disabled = !fecha;
    ls.forEach(x => {
      const existe = usados.find(u => u.numero_lote.toLowerCase() === x.lote.toLowerCase());
      const marca = x.tr.querySelector('.dmInfo');
      marca.innerHTML = existe
        ? `<span class="tag t-mut" title="O material entrará neste lote que já existe">já existe · saldo ${nf(existe.saldo)}</span>` : '';
    });
  };

  const addLinha = (lote = '', qtd = '') => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="dmL" value="${esc(lote)}" placeholder="número do lote"
            style="width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 9px">
          <div class="dmInfo" style="margin-top:4px"></div></td>
      <td class="num"><input class="dmQ" type="number" step="0.0001" value="${qtd}" placeholder="0"
            style="width:130px;text-align:right;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 9px"></td>
      <td><button class="btn sm gh dmX" title="Remover lance">✕</button></td>`;
    $$('#dmLinhas').appendChild(tr);
    tr.querySelector('.dmL').oninput = somar;
    tr.querySelector('.dmQ').oninput = somar;
    tr.querySelector('.dmX').onclick = () => { tr.remove(); somar(); };
    somar();
  };

  $$('#dmAdd').onclick = () => addLinha();
  $$('#dmResto').onclick = () => {
    const falta = Number((saldo - linhas().reduce((a,x)=>a+x.qtd,0)).toFixed(4));
    if(falta <= 0) return toast('Já não falta nada para fechar.', 'err');
    const vazia = linhas().find(x => !x.qtd);
    if(vazia) { vazia.tr.querySelector('.dmQ').value = falta; somar(); }
    else addLinha('', falta);
  };

  $$('#dmOk').onclick = async () => {
    const partes = linhas().map(x => ({ lote: x.lote, qtd: x.qtd }));
    $$('#dmOk').disabled = true;
    const { data, error } = await sb.rpc('fn_desmontar_lote_total', {
      p_lot: lotId, p_partes: partes,
      p_motivo: $$('#dmMotivo').value || null,
      p_observacao: $$('#dmObs').value || null });
    $$('#dmOk').disabled = false;
    if(error) return err(error);
    m.remove();
    toast(`${esc(numeroLote)} desmembrado em ${data.lances.length} lance(s): ${data.lotes_novos} lote(s) novo(s)`
      + (data.lotes_reaproveitados ? `, ${data.lotes_reaproveitados} reaproveitado(s)` : '') + '.');
    route();
  };

  addLinha(); addLinha();
};

ROUTES.movimentos = async () => {
  $('#view').innerHTML = header('Movimentações','Livro-razão do estoque. Nada aqui é apagado — estornos ficam visíveis com a tarja.',
    `${can('admin','auditor')?`<button class="btn" id="manual">Lançar nota manualmente</button>`:''}
     <button class="btn gh sm" id="exp">Exportar Excel</button>`) + `
  <div class="filters">
    <div class="fld" style="min-width:230px"><label>Produto / documento</label><input id="q" placeholder="código, descrição ou NF"></div>
    <div class="fld" style="min-width:190px"><label>Lote</label><input id="ql" placeholder="número do lote">

    <div class="fld"><label>Tipo</label><select id="tp"><option value="">Todos</option>

    <div class="fld"><label>&nbsp;</label><button class="btn sm" id="go">Filtrar</button></div>
  </div>
  <div id="fantasmas"></div>
  <div class="panel"><div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Data</th><th>Tipo</th><th>Documento</th><th>Produto</th><th>Lote</th>
      <th class="num">Qtd</th><th class="num">Valor custo</th><th>Cliente / origem</th><th>Situação</th><th>Ação</th></tr></thead>
    <tbody id="tb"><tr><td colspan="10" class="load"><span class="spin"></span>Carregando…</td></tr></tbody>
  </table></div></div></div>`;

  // produtos que a importação criou sozinha e que se parecem com um código já existente:
  // é a assinatura de código digitado errado
  sb.rpc('fn_produtos_auto_importados').then(({ data }) => {
    const susp = (data||[]).filter(p => p.parecido_com && Number(p.movimentos) > 0);
    if(!susp.length || !$('#fantasmas')) return;
    $('#fantasmas').innerHTML = `<div class="panel" style="border-color:rgba(210,153,34,.4)">
      <div class="ph"><h3>Códigos que parecem digitação errada</h3>
        <span class="tag t-warn">${nf(susp.length)}</span></div>
      <div class="pb"><div style="color:var(--tx2);font-size:12.5px;margin-bottom:10px">
        A importação aceita código desconhecido de propósito, para não travar a rotina — mas então cria um produto
        que não existe. Abaixo, os que a importação criou e que se parecem com um código já cadastrado.
        Filtre pelo código para achar o movimento e use <b>Trocar produto</b>.</div>
      ${susp.map(p=>`<div class="cnLinha">
        <div class="cresce"><b class="mono">${esc(p.sku)}</b> — ${esc(p.descricao||'')}
          <div style="color:var(--tx3);font-size:11.5px">${nf(p.movimentos)} movimento(s) · saldo ${nf(p.saldo)}
            · parece <b class="mono">${esc(p.parecido_com)}</b></div></div>
        <button class="btn sm gh" data-fsku="${esc(p.sku)}">filtrar</button></div>`).join('')}
      </div></div>`;
    $('#fantasmas').querySelectorAll('[data-fsku]').forEach(b => b.onclick = () => {
      $('#q').value = b.dataset.fsku; load();
    });
  }).catch(()=>{});
  let rows = [];
  const load = async () => {
    let q = sb.from('stock_movements')
      .select('id,movement_date,tipo,documento,quantidade,sinal,valor_custo,cliente_nome,origem,motivo,status_transito,voided_at,reverses_movement_id,products(sku,descricao),lots(numero_lote)')
      .order('movement_date',{ascending:false}).order('seq',{ascending:false}).limit(500);
    const t=$('#tp').value, de=$('#de').value, ate=$('#ate').value, s=$('#q').value.trim();
    const sl = $('#ql').value.trim();
    if(t) q = q.eq('tipo',t);
    if(de) q = q.gte('movement_date',de);
    if(ate) q = q.lte('movement_date',ate);
    if(sl){
      // busca por lote ignora ponto de milhar: 2015542026 acha "2.015.542.026" também
      const { data:ls, error:el } = await sb.rpc('fn_buscar_lotes', { p_texto: sl, p_limite: 300 });
      if(el) return err(el);
      const lids = (ls||[]).map(l=>l.lot_id);
      const grafias = [...new Set((ls||[]).map(l=>l.numero_lote))];
      $('#qlInfo').innerHTML = !lids.length
        ? '<span class="neg">nenhum lote com esse número</span>'
        : `${lids.length} lote(s): ${grafias.slice(0,4).map(g=>esc(g)).join(', ')}${grafias.length>4?'…':''}`;
      if(!lids.length){
        $('#tb').innerHTML = '<tr><td colspan="10" class="empty">Nenhum lote com esse número.</td></tr>';
        rows = []; return;
      }
      q = q.in('lot_id', lids);
    } else $('#qlInfo').innerHTML = '';
    if(s){
      // o campo aceita código do produto, descrição ou número do documento:
      // resolvo os produtos primeiro e busco os dois lados de uma vez
      const { data:ps } = await sb.from('products').select('id')
        .or(`sku.ilike.%${s}%,descricao.ilike.%${s}%`).limit(300);
      const ids = (ps||[]).map(p=>p.id);
      q = ids.length ? q.or(`documento.ilike.%${s}%,product_id.in.(${ids.join(',')})`)
                     : q.ilike('documento', `%${s}%`);
    }
    const { data, error } = await q;
    if(error) return err(error);
    rows = data;
    // quais saídas já têm devolução ou cancelamento lançado
    const ids = data.map(r=>r.id);
    const { data:revs } = ids.length
      ? await sb.from('stock_movements').select('reverses_movement_id,motivo,documento')
          .in('reverses_movement_id', ids).is('voided_at', null)
      : { data: [] };
    const revertidos = new Map((revs||[]).map(r=>[r.reverses_movement_id, r]));
    $('#tb').innerHTML = data.length ? data.map(r=>`<tr${r.voided_at?' style="opacity:.5;text-decoration:line-through"':''}>
      <td>${dt(r.movement_date)}</td><td>${esc(r.tipo)}</td><td class="mono">${esc(r.documento||'—')}</td>
      <td class="mono">${esc(r.products?.sku||'—')}</td><td class="mono">${esc(r.lots?.numero_lote||'—')}</td>
      <td class="num ${sgn(r.sinal)}">${r.sinal>0?'+':''}${nf(r.quantidade)}</td>
      <td class="num">${money(r.valor_custo)}</td>
      <td>${esc(r.cliente_nome||r.origem||'—')}</td>
      <td>${r.voided_at?'<span class="tag t-mut">estornado</span>':
           r.status_transito==='EM_TRANSITO'?'<span class="tag t-info">em trânsito</span>':
           r.status_transito==='DIVERGENTE'?'<span class="tag t-bad">receb. divergente</span>':
           r.reverses_movement_id?`<span class="tag t-info">${esc(r.motivo||'estorno')}</span>`:
           '<span class="tag t-ok">efetivado</span>'}</td>
      <td style="white-space:nowrap">${ revertidos.has(r.id)
        ? `<span class="tag t-info">${esc(revertidos.get(r.id).motivo||'revertida')}</span>`
        : (['SAIDA','TRANSF_SAIDA'].includes(r.tipo) && !r.voided_at && can('admin','auditor')) ? `
        <button class="btn sm gh" onclick="reverter('${r.id}','DEVOLUCAO','${esc(r.products?.sku||'')}',${r.quantidade},'${esc(r.documento||'')}')">Devolução</button>
        <button class="btn sm gh" onclick="reverter('${r.id}','CANCELAMENTO','${esc(r.products?.sku||'')}',${r.quantidade},'${esc(r.documento||'')}')">Cancelar</button>` : ''}
        ${(!r.voided_at && !revertidos.has(r.id) && can('admin','auditor'))
          ? `<button class="btn sm gh" title="lançado no código errado"
               onclick="trocarProduto('${r.id}','${esc(r.products?.sku||'')}','${esc(r.lots?.numero_lote||'')}',${r.quantidade},'${esc(r.tipo)}','${esc(r.documento||'')}')">Trocar produto</button>` : ''}</td>
    </tr>`).join('') : '<tr><td colspan="10" class="empty">Nenhuma movimentação. Comece pela Importação.</td></tr>';
  };
  $('#go').onclick = load;
  $('#q').onkeydown = e => { if(e.key === 'Enter') load(); };
  $('#ql').onkeydown = e => { if(e.key === 'Enter') load(); };
  on('#manual','click', lancamentoManual);
  $('#exp').onclick = () => toXlsx(rows.map(r=>({Data:r.movement_date,Tipo:r.tipo,Documento:r.documento,
    Produto:r.products?.sku,Descricao:r.products?.descricao,Lote:r.lots?.numero_lote,
    Quantidade:Number(r.quantidade)*r.sinal,ValorCusto:r.valor_custo,Cliente:r.cliente_nome,
    Estornado:r.voided_at?'SIM':'NAO'})), 'movimentacoes.xlsx');
  load();
};

/* Lançamento manual: para o movimento que não veio de arquivo nem tem saída no
   sistema para vincular — o caso típico é a devolução de uma venda faturada
   antes do Marco Zero, que por definição não existe no razão.
   Uma nota tem vários itens: o cabeçalho (tipo, data, NF, cliente) é preenchido
   uma vez e os itens vão sendo acumulados. O envio é tudo ou nada — se um item
   falhar, nenhum entra: nota meio lançada é pior que nota não lançada, porque
   ninguém percebe o que ficou faltando. */
async function lancamentoManual(){
  const prods = await fetchAll(() => sb.from('products').select('id,sku,descricao,unidade').order('sku'));
  const { data:mz } = await sb.from('erp_snapshots').select('data_referencia').eq('marco_zero',true).maybeSingle();
  const itens = [];   // { product_id, sku, descricao, unidade, numero_lote, quantidade }

  const m = modal('Lançar nota manualmente', `
    <div class="hint">Use quando não existir arquivo nem saída no sistema para vincular — por exemplo,
    a <b>devolução de uma venda faturada antes do Marco Zero</b>${mz?` (${dt(mz.data_referencia)})`:''}.
    Preencha o cabeçalho uma vez, acumule os itens da nota e lance tudo de uma vez.
    Todo lançamento manual fica marcado como tal e registrado na auditoria com seu usuário.</div>

    <div class="filters">
      <div class="fld"><label>Tipo</label><select id="lmTipo">
        <option value="DEVOLUCAO">Devolução — soma ao estoque</option>
        <option value="ENTRADA">Entrada — soma ao estoque</option>
        <option value="SAIDA">Saída — baixa do estoque</option></select></div>
      <div class="fld"><label>Data</label><input id="lmData" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="fld" style="flex:1;min-width:170px"><label>Nota fiscal / documento</label>
        <input id="lmDoc" placeholder="número da NF"></div>
      <div class="fld" style="flex:1;min-width:170px"><label>Cliente / origem</label>
        <input id="lmCli" placeholder="opcional"></div>
    </div>
    <div class="fld"><label>Observação da nota</label>
      <textarea id="lmObs" rows="2" placeholder="opcional, mas ajuda na auditoria"></textarea></div>

    <div class="fld" id="lmWrapCc"><label style="font-weight:400">
      <input type="checkbox" id="lmCc" style="width:auto;margin-right:7px" checked>
      Venda original anterior ao Marco Zero — <b>não abater do consumo</b></label>
      <div style="font-size:11.5px;color:var(--tx3);margin-top:4px">A saída nunca foi contada pelo sistema.
        Se a devolução abatesse o consumo, o consumo médio ficaria menor que a realidade e a cobertura, maior.</div></div>

    <div style="border-top:1px solid var(--line);margin:16px 0 13px"></div>
    <div style="font-weight:600;margin-bottom:9px">Itens da nota</div>

    <div class="fld"><label>Produto</label>
      <input id="lmProd" list="lmLista" autocomplete="off" placeholder="digite o código ou parte da descrição">
      <datalist id="lmLista">${prods.map(p=>`<option value="${esc(p.sku)}">${esc(p.descricao)}</option>`).join('')}</datalist>
      <div id="lmInfo" style="font-size:11.5px;color:var(--tx3);margin-top:4px"></div></div>

    <div class="filters">
      <div class="fld" style="flex:1;min-width:200px"><label>Lote</label>
        <select id="lmLote"><option value="">— escolha o produto primeiro —</option></select>
        <div style="font-size:11.5px;color:var(--tx3);margin-top:4px">Se o lote não estiver na lista, escolha
          "outro lote" e digite o número.</div></div>
      <div class="fld" id="lmWrapNovo" style="display:none;min-width:180px"><label>Número do lote</label>
        <input id="lmLoteNovo" placeholder="ex.: 263021344"></div>
      <div class="fld"><label>Quantidade</label><input id="lmQtd" type="number" step="0.0001" placeholder="0"></div>
      <div class="fld" style="align-self:flex-end"><button class="btn gh" id="lmAdd">+ Adicionar item</button></div>
    </div>

    <div id="lmTabela" style="margin:14px 0"></div>
    <button class="btn" id="lmOk" disabled>Lançar nota</button>`);

  const $$ = sel => m.querySelector(sel);
  let produto = null;

  const acharProd = txt => {
    const t = (txt||'').trim().toLowerCase(); if(!t) return null;
    return prods.find(p => p.sku.toLowerCase() === t)
        || prods.find(p => p.sku.toLowerCase().startsWith(t))
        || prods.find(p => (p.sku+' '+p.descricao).toLowerCase().includes(t)) || null;
  };

  const carregarLotes = async () => {
    const sel = $$('#lmLote');
    if(!produto){ sel.innerHTML = '<option value="">— escolha o produto primeiro —</option>'; return; }
    const { data } = await sb.from('v_lots_live').select('numero_lote,qtd_atual,armazem')
      .eq('product_id', produto.id).order('numero_lote');
    sel.innerHTML = (data||[]).map(l =>
      `<option value="${esc(l.numero_lote)}">${esc(l.numero_lote)} — saldo ${nf(l.qtd_atual)}</option>`).join('')
      + '<option value="__novo__">outro lote (digitar)</option>';
    sel.onchange();
  };

  const desenharTabela = () => {
    const t = $$('#lmTipo').value;
    const totQ = itens.reduce((a,i)=>a+i.quantidade, 0);
    $$('#lmTabela').innerHTML = !itens.length
      ? `<div class="empty" style="padding:16px;font-size:12.5px">Nenhum item ainda. Escolha produto, lote e quantidade e clique em <b>+ Adicionar item</b>.</div>`
      : `<div class="panel"><div class="pb flush"><table>
          <thead><tr><th>Código</th><th>Descrição</th><th>Lote</th><th class="num">Quantidade</th><th></th></tr></thead>
          <tbody>${itens.map((i,ix)=>`<tr>
            <td class="mono">${esc(i.sku)}</td><td>${esc(i.descricao)}</td>
            <td class="mono">${esc(i.numero_lote)}</td>
            <td class="num ${t==='SAIDA'?'neg':'pos'}">${t==='SAIDA'?'−':'+'}${nf(i.quantidade)} ${esc(i.unidade||'')}</td>
            <td><button class="btn sm gh" data-rm="${ix}">remover</button></td></tr>`).join('')}
          </tbody>
          <tfoot><tr><td colspan="3"><b>${itens.length} ${itens.length===1?'item':'itens'}</b></td>
            <td class="num"><b>${nf(totQ)}</b></td><td></td></tr></tfoot>
        </table></div></div>`;
    $$('#lmTabela').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
      itens.splice(Number(b.dataset.rm), 1); desenharTabela();
    });
    $$('#lmOk').disabled = !itens.length;
    $$('#lmOk').textContent = itens.length ? `Lançar nota — ${itens.length} ${itens.length===1?'item':'itens'}` : 'Lançar nota';
  };

  $$('#lmProd').oninput = () => {
    produto = acharProd($$('#lmProd').value);
    $$('#lmInfo').innerHTML = produto
      ? `<span class="pos">✔</span> ${esc(produto.sku)} — ${esc(produto.descricao)} (${esc(produto.unidade)})`
      : ($$('#lmProd').value.trim() ? '<span class="neg">nenhum produto encontrado</span>' : '');
  };
  $$('#lmProd').onchange = async () => { $$('#lmProd').oninput(); await carregarLotes(); };
  $$('#lmLote').onchange = () => {
    $$('#lmWrapNovo').style.display = $$('#lmLote').value === '__novo__' ? '' : 'none';
  };
  $$('#lmTipo').onchange = () => {
    $$('#lmWrapCc').style.display = $$('#lmTipo').value === 'DEVOLUCAO' ? '' : 'none';
    desenharTabela();
  };

  $$('#lmAdd').onclick = () => {
    if(!produto) return toast('Escolha um produto válido.', 'err');
    const q = Number($$('#lmQtd').value||0);
    if(!(q > 0)) return toast('Informe a quantidade.', 'err');
    const loteSel = $$('#lmLote').value;
    const lote = loteSel === '__novo__' ? ($$('#lmLoteNovo').value||'').trim() : loteSel;
    if(!lote) return toast('Informe o lote.', 'err');

    const igual = itens.find(i => i.product_id === produto.id && i.numero_lote === lote);
    if(igual){
      igual.quantidade += q;                       // mesma linha duas vezes: soma em vez de duplicar
      toast(`Somado ao item que já estava na nota: ${nf(igual.quantidade)}.`);
    } else {
      itens.push({ product_id: produto.id, sku: produto.sku, descricao: produto.descricao,
                   unidade: produto.unidade, numero_lote: lote, quantidade: q });
    }
    // limpa só o item, mantém o cabeçalho
    $$('#lmProd').value = ''; $$('#lmQtd').value = ''; $$('#lmLoteNovo').value = '';
    $$('#lmInfo').innerHTML = ''; produto = null;
    $$('#lmLote').innerHTML = '<option value="">— escolha o produto primeiro —</option>';
    $$('#lmWrapNovo').style.display = 'none';
    desenharTabela();
    $$('#lmProd').focus();
  };
  // Enter na quantidade adiciona o item, sem tirar a mão do teclado
  $$('#lmQtd').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); $$('#lmAdd').click(); } };

  $$('#lmOk').onclick = async () => {
    if(!itens.length) return toast('Adicione pelo menos um item.', 'err');
    const tipo = $$('#lmTipo').value;
    $$('#lmOk').disabled = true;
    const { data, error } = await sb.rpc('fn_lancar_nota_manual', {
      p_tipo: tipo, p_data: $$('#lmData').value,
      p_documento: $$('#lmDoc').value || null,
      p_cliente: $$('#lmCli').value || null,
      p_observacao: $$('#lmObs').value || null,
      p_conta_consumo: (tipo === 'DEVOLUCAO' && $$('#lmCc').checked) ? false : null,
      p_itens: itens.map(i => ({ product_id: i.product_id, numero_lote: i.numero_lote,
                                 quantidade: i.quantidade, armazem: '2' })) });
    $$('#lmOk').disabled = false;
    if(error) return err(error);          // nenhum item entrou: a função é tudo ou nada
    await registrarCausaNeg('lancamento_manual', `${tipo} · ${data.itens} itens · NF ${$$('#lmDoc').value||'sem nota'}`);
    m.remove();
    toast(`Nota lançada: ${data.itens} ${data.itens===1?'item':'itens'}, ${nf(data.quantidade_total)} no total (${money(data.valor_total)}).`);
    route();
  };

  desenharTabela();
}

window.lancamentoManual = lancamentoManual;

/* Trocar o produto de um movimento lançado no código errado.
   Não reescreve o movimento: estorna o errado e faz nascer o equivalente no produto
   certo. Os dois continuam no Kardex — e o valor muda, porque o produto fantasma
   criado pela importação costuma entrar com custo zero. */
window.trocarProduto = async (movId, skuAtual, lote, qtd, tipo, doc) => {
  const prods = await fetchAll(() => sb.from('products')
    .select('id,sku,descricao,unidade,custo_unitario,status').order('sku'));
  const atual = prods.find(p => p.sku === skuAtual);
  const parecidos = prods.filter(p => p.sku !== skuAtual && p.status !== 'inativo' &&
    (p.sku.startsWith(skuAtual) || skuAtual.startsWith(p.sku)));

  const m = modal(`Trocar produto — ${skuAtual}`, `
    <div class="hint">O movimento errado é <b>estornado</b> e um equivalente nasce no produto certo, com a
    mesma data, nota, lote e quantidade. Os dois continuam no Kardex — nada é apagado. O <b>valor muda</b>,
    porque o produto vai passar a usar o custo do código correto.</div>
    <dl class="kv" style="margin-bottom:14px">
      <dt>Movimento</dt><dd>${esc(tipo)} de <b>${nf(qtd)}</b>${doc?` · NF <span class="mono">${esc(doc)}</span>`:''}</dd>
      <dt>Lote</dt><dd class="mono">${esc(lote||'—')}</dd>
      <dt>Código atual</dt><dd class="mono">${esc(skuAtual)}${atual&&atual.status==='auto_importado'
        ?' <span class="tag t-warn">criado pela importação</span>':''}</dd>
    </dl>
    ${parecidos.length?`<div class="fld"><label>Códigos parecidos</label>
      <div>${parecidos.slice(0,6).map(p=>`<button class="btn sm gh" data-sug="${esc(p.sku)}"
        style="margin:0 6px 6px 0">${esc(p.sku)}</button>`).join('')}</div></div>`:''}
    <div class="fld"><label>Código correto</label>
      <input id="tpProd" list="tpLista" autocomplete="off" placeholder="digite o código correto">
      <datalist id="tpLista">${prods.filter(p=>p.status!=='inativo').map(p=>
        `<option value="${esc(p.sku)}">${esc(p.descricao)}</option>`).join('')}</datalist>
      <div id="tpInfo" style="font-size:11.5px;color:var(--tx3);margin-top:4px"></div></div>
    <div class="fld"><label>Motivo <span style="color:var(--bad)">*</span></label>
      <select id="tpMotivo">
        <option>Código digitado errado no lançamento</option>
        <option>Código truncado no arquivo do ERP</option>
        <option>Produto trocado na conferência</option>
        <option>Outro (descrever abaixo)</option>
      </select></div>
    <div class="fld"><label>Observação</label><textarea id="tpObs" rows="2" placeholder="opcional"></textarea></div>
    <div id="tpPrev" style="margin:12px 0;font-size:13px"></div>
    <button class="btn" id="tpOk" disabled>Trocar produto</button>`);

  const $$ = q => m.querySelector(q);
  let destino = null;
  const achar = txt => {
    const t = (txt||'').trim().toLowerCase(); if(!t) return null;
    return prods.find(p => p.sku.toLowerCase() === t)
        || prods.find(p => p.sku.toLowerCase().startsWith(t) && p.status !== 'inativo') || null;
  };
  const prev = () => {
    destino = achar($$('#tpProd').value);
    const ok = destino && destino.sku !== skuAtual;
    $$('#tpInfo').innerHTML = !destino
      ? ($$('#tpProd').value.trim() ? '<span class="neg">nenhum produto encontrado</span>' : '')
      : destino.sku === skuAtual ? '<span class="neg">é o mesmo código do movimento</span>'
      : `<span class="pos">✔</span> ${esc(destino.sku)} — ${esc(destino.descricao)}`;
    $$('#tpPrev').innerHTML = ok
      ? `<span class="tag t-mut">${esc(skuAtual)}</span> → <span class="tag t-ok">${esc(destino.sku)}</span>
         &nbsp;<span class="mut">${nf(qtd)} ${esc(destino.unidade||'')} no lote ${esc(lote||'—')}</span>`
      : '';
    $$('#tpOk').disabled = !ok;
  };
  $$('#tpProd').oninput = prev;
  m.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { $$('#tpProd').value = b.dataset.sug; prev(); });
  prev();

  $$('#tpOk').onclick = async () => {
    if(!destino) return;
    const mot = $$('#tpMotivo').value, obs = $$('#tpObs').value;
    if(mot.startsWith('Outro') && !obs.trim()) return toast('Descreva o motivo na observação.', 'err');
    $$('#tpOk').disabled = true;
    const { data, error } = await sb.rpc('fn_corrigir_produto_movimento', {
      p_movement: movId, p_product_destino: destino.id,
      p_motivo: obs ? `${mot} — ${obs}` : mot });
    $$('#tpOk').disabled = false;
    if(error) return err(error);
    m.remove();
    toast(`${nf(data.quantidade)} movido de ${data.de} para ${data.para}. Valor: ${money(data.valor_antes)} → ${money(data.valor_depois)}.`
      + (data.produto_origem_inativado ? ` O código ${data.de} ficou sem movimento e foi inativado.` : ''));
    route();
  };
};

window.reverter = (id, acao, sku, qtdMax, docOriginal) => {
  const ehDev = acao === 'DEVOLUCAO';
  const rotulo = ehDev ? 'Devolução' : 'Cancelamento';
  const m = modal(`${rotulo} — ${sku}`, `
    <div class="hint">Isto <b>não apaga</b> a saída original. Cria uma entrada ligada a ela, e as duas continuam
    visíveis no Kardex — é assim que o histórico segue auditável. O consumo do mês é abatido automaticamente.</div>
    <dl class="kv" style="margin-bottom:16px">
      <dt>Nota fiscal da saída</dt><dd class="mono">${esc(docOriginal||'sem nota')}</dd>
      <dt>Quantidade da saída</dt><dd>${nf(qtdMax)}</dd></dl>
    ${ehDev ? `<div class="fld"><label>Nota fiscal de entrada da devolução <span style="color:var(--bad)">*</span></label>
        <input id="doc" placeholder="número da NF gerada na devolução">
        <div style="font-size:11.5px;color:var(--tx3);margin-top:4px">
          A devolução gera nota nova. Ela fica como documento do movimento, e a NF ${esc(docOriginal||'da saída')} fica guardada como referência.</div></div>`
      : `<div class="fld"><label>Nota fiscal cancelada</label>
        <input value="${esc(docOriginal||'sem nota')}" disabled style="opacity:.65">
        <div style="font-size:11.5px;color:var(--tx3);margin-top:4px">
          Cancelamento não gera nota nova — fica registrado sobre a própria NF cancelada.</div></div>`}
    <div class="fld"><label>Quantidade a ${ehDev?'devolver':'cancelar'}</label>
      <input id="q" type="number" step="0.0001" max="${qtdMax}" value="${qtdMax}"></div>
    <div class="fld"><label>Observação</label><textarea id="o" rows="2" placeholder="opcional"></textarea></div>
    <button class="btn" id="ok">Confirmar ${rotulo.toLowerCase()}</button>`);
  m.querySelector('#ok').onclick = async () => {
    const doc = ehDev ? (m.querySelector('#doc').value||'').trim() : null;
    if(ehDev && !doc) return toast('Informe o número da nota fiscal de entrada da devolução.', 'err');
    const { data, error } = await sb.rpc('fn_reverter_movimento', {
      p_movement:id, p_acao:acao,
      p_qtd:Number(m.querySelector('#q').value||0),
      p_observacao:m.querySelector('#o').value||null,
      p_documento:doc });
    if(error) return err(error);
    await registrarCausaNeg(ehDev ? 'devolucao' : 'cancelamento', `NF ${data.documento||docOriginal||''}`);
    document.querySelectorAll('.modal').forEach(x => x.remove());
    m.remove();
    toast(ehDev ? `Devolução registrada na NF ${data.documento}: ${nf(data.quantidade)} voltou ao estoque.`
                : `Cancelamento registrado na NF ${data.documento}: ${nf(data.quantidade)} voltou ao estoque.`);
    route();
  };
};

ROUTES.kardex = async () => {
  const pid = new URLSearchParams((location.hash.split('?')[1]||'')).get('p');
  const prods = await fetchAll(() => sb.from('products').select('id,sku,descricao,unidade').order('sku'));
  $('#view').innerHTML = header('Kardex','Saldo inicial → movimentações → saldo final. A ordem é determinística: data + sequência de registro.',
    `<button class="btn gh sm" id="exp">Exportar Excel</button>`) + `
  <div class="filters">
    <div class="fld" style="min-width:360px"><label>Produto</label>
      <input id="pbusca" list="lista-prod" autocomplete="off"
             placeholder="digite o código ou parte da descrição"
             value="${pid ? esc(((prods||[]).find(x=>x.id===pid)||{}).sku||'') : ''}">
      <datalist id="lista-prod">
        ${(prods||[]).map(p=>`<option value="${esc(p.sku)}">${esc(p.descricao)}</option>`).join('')}
      </datalist>
      <input type="hidden" id="p" value="${pid||''}">
      <div id="pinfo" style="font-size:11.5px;color:var(--tx3);margin-top:4px"></div></div>
    <div class="fld"><label>Lote</label><select id="l"><option value="">Todos</option></select></div>
    <div class="fld"><label>De</label><input id="de" type="date"></div>
    <div class="fld"><label>Até</label><input id="ate" type="date"></div>
    <div class="fld"><label>&nbsp;</label><button class="btn sm" id="go">Consultar</button></div>
  </div>
  <div id="kxResultado"></div>`;

  let rows = [];
  const loadLots = async () => {
    const id = $('#p').value; const sel = $('#l');
    sel.innerHTML = '<option value="">Todos</option>';
    if(!id) return;
    const { data } = await sb.from('v_lots_live').select('lot_id,numero_lote,qtd_atual').eq('product_id',id).order('numero_lote');
    (data||[]).forEach(l => sel.insertAdjacentHTML('beforeend', `<option value="${l.lot_id}">${esc(l.numero_lote)} (${nf(l.qtd_atual)})</option>`));
  };
  const load = async () => {
    const id = $('#p').value;
    if(!id) { $('#kxResultado').innerHTML = '<div class="panel"><div class="empty">Selecione um produto.</div></div>'; return; }
    $('#kxResultado').innerHTML = '<div class="load"><span class="spin"></span>Montando o Kardex…</div>';
    const { data, error } = await sb.rpc('fn_kardex', {
      p_product:id, p_lot:$('#l').value||null, p_de:$('#de').value||null, p_ate:$('#ate').value||null,
      p_tipos:null, p_documento:null, p_user:null, p_limit:1000, p_offset:0 });
    if(error) return err(error);
    rows = data||[];
    const ini = rows.length ? Number(rows[0].saldo_inicial) : 0;
    const fim = rows.length ? Number(rows[rows.length-1].saldo_corrente) : ini;
    const p = (prods||[]).find(x=>x.id===id);
    $('#kxResultado').innerHTML = `
    <div class="cards">
      <div class="card"><div class="lb">Saldo inicial</div><div class="vl">${nf(ini)}</div><div class="ft">${esc(p?.unidade||'')}</div></div>
      <div class="card"><div class="lb">Movimentações</div><div class="vl">${nf(rows.length)}</div></div>
      <div class="card ok"><div class="lb">Saldo final</div><div class="vl">${nf(fim)}</div></div>
    </div>
    <div class="panel"><div class="ph"><h3>${esc(p?.sku||'')} — ${esc(p?.descricao||'')}</h3></div>
    <div class="pb flush"><div class="scroll"><table>
      <thead><tr><th>Data</th><th>Documento</th><th>Tipo</th><th>Lote</th>
        <th class="num">Entrada</th><th class="num">Saída</th><th class="num">Ajuste</th>
        <th class="num">Saldo</th><th class="num">Custo unit.</th><th>Situação</th></tr></thead>
      <tbody>${rows.length ? rows.map(r=>`<tr${r.estornado?' style="opacity:.45;text-decoration:line-through"':''}>
        <td>${dt(r.movement_date)}</td><td class="mono">${esc(r.documento||'—')}</td><td>${esc(r.tipo)}</td>
        <td class="mono">${esc(r.numero_lote||'—')}</td>
        <td class="num pos">${r.entrada?nf(r.entrada):''}</td>
        <td class="num neg">${r.saida?nf(r.saida):''}</td>
        <td class="num ${sgn(r.ajuste)}">${r.ajuste?nf(r.ajuste):''}</td>
        <td class="num"><b>${nf(r.saldo_corrente)}</b></td>
        <td class="num">${money(r.custo_unitario)}</td>
        <td>${r.estornado?'<span class="tag t-mut">estornado</span>':r.em_transito?'<span class="tag t-info">em trânsito</span>':''}</td>
      </tr>`).join('') : '<tr><td colspan="10" class="empty">Sem movimentação no período.</td></tr>'}</tbody>
    </table></div></div></div>`;
  };
  // digitável: aceita código exato, ou acha por trecho do código/descrição
  const acha = txt => {
    const t = (txt||'').trim().toLowerCase(); if(!t) return null;
    return (prods||[]).find(p => p.sku.toLowerCase() === t)
        || (prods||[]).find(p => p.sku.toLowerCase().startsWith(t))
        || (prods||[]).find(p => (p.sku+' '+p.descricao).toLowerCase().includes(t))
        || null;
  };
  const escolher = async (auto) => {
    const p = acha($('#pbusca').value);
    $('#p').value = p ? p.id : '';
    $('#pinfo').innerHTML = p ? `<span class="pos">✔</span> ${esc(p.sku)} — ${esc(p.descricao)}`
      : ($('#pbusca').value.trim() ? '<span class="neg">nenhum produto encontrado</span>' : '');
    if(p && auto){ await loadLots(); load(); }
  };
  on('#pbusca','change', () => escolher(true));
  on('#pbusca','input',  () => escolher(false));
  on('#pbusca','keydown', e => { if(e.key==='Enter') escolher(true); });
  $('#go').onclick = async () => { await escolher(false); if($('#p').value){ await loadLots(); } load(); };
  $('#exp').onclick = () => rows.length ? toXlsx(rows.map(r=>({Data:r.movement_date,Documento:r.documento,Tipo:r.tipo,
    Lote:r.numero_lote,Entrada:r.entrada,Saida:r.saida,Ajuste:r.ajuste,Saldo:r.saldo_corrente,
    CustoUnit:r.custo_unitario,Estornado:r.estornado?'SIM':'NAO'})),'kardex.xlsx') : toast('Nada para exportar','err');
  if(pid){ escolher(false); await loadLots(); load(); }
  else $('#kxResultado').innerHTML='<div class="panel"><div class="empty">Digite um código ou uma descrição para começar.</div></div>';
};

/* ---------- leitura tolerante do arquivo do ERP ----------
   O ERP exporta número em pt-BR ("9.300" = nove mil, "14.446,62") e às vezes
   em CSV mal decodificado ("DescriÃ§Ã£o"). Ler isso de forma ingênua transforma
   9.300 em 9,3 — um erro que não aparece na tela e destrói o saldo calculado.
   As três defesas abaixo existem por causa disso.                            */

// texto que foi lido como Latin-1 mas na verdade era UTF-8
const demoji = s => {
  if(typeof s !== 'string' || !/[ÃÂ]/.test(s)) return s;
  try { return new TextDecoder('utf-8').decode(Uint8Array.from(s, c => c.charCodeAt(0) & 0xff)); }
  catch(e){ return s; }
};
// "Disponível", "DisponÃ­vel", "DISPONIVEL " -> "disponivel"
const norm = s => demoji(String(s??'')).normalize('NFD').replace(/[̀-ͯ]/g,'')
                    .toLowerCase().replace(/[^a-z0-9]/g,'');
// número em pt-BR, en-US ou já numérico
const numBR = v => {
  if(v===null||v===undefined||v==='') return 0;
  if(typeof v === 'number') return v;
  let s = String(v).replace(/[\s ]|R\$/g,'').trim();
  if(!s) return 0;
  const neg = /^\(.*\)$/.test(s) || s.startsWith('-');
  s = s.replace(/[()\-]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');        // 14.446,62 -> 14446.62
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');      // 9.300 -> 9300 (milhar)
  const n = Number(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
};
const idx  = row => { const m={}; Object.keys(row).forEach(k => m[norm(k)] = k); return m; };
const pick = (row,map,...alias) => { for(const a of alias){ const k=map[norm(a)]; if(k!==undefined && row[k]!==null && row[k]!=='') return row[k]; } return null; };
const txt  = (row,map,...alias) => { const v=pick(row,map,...alias); return v==null?null:demoji(String(v)).trim(); };
const qty  = (row,map,...alias) => numBR(pick(row,map,...alias));

const isoDate = v => {
  if(!v) return null;
  if(v instanceof Date) return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const s = String(v).trim();
  const br = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(br){ const a = br[3].length===2 ? '20'+br[3] : br[3];
          return `${a}-${br[2].padStart(2,'0')}-${br[1].padStart(2,'0')}`; }
  return s.slice(0,10);
};

const movRow = (r,i) => { const m = idx(r); return {
  linha:i+2, filial: txt(r,m,'Filial'),
  data: isoDate(pick(r,m,'Emissão','Emissao','Data','Dt.Emissao')),
  pedido: txt(r,m,'Pedido'),
  cliente_codigo: txt(r,m,'Cliente-Loja','Cliente'),
  cliente_nome: txt(r,m,'Nome Fantasia','Nome','Razao Social'),
  documento: txt(r,m,'Nr.NF','NF','Nota','Documento'),
  produto: txt(r,m,'Produto','Codigo','Cod.Produto'),
  descricao: txt(r,m,'Descrição','Descricao'),
  lote: txt(r,m,'Lote') || '',
  qtd: qty(r,m,'Qtd.','Quantidade'),
  valor: qty(r,m,'R$ Vda.','Valor','Vlr Total'),
  tes: txt(r,m,'TES'), cfop: txt(r,m,'CFOP'),
  armazem: txt(r,m,'Armz.','Armaz.','Armazem','Local') || '2' }; };

const SHEETS = {
  saldo_erp: { rotulo:'Estoque Atual (saldo do ERP)',
    map: r => { const m = idx(r); return {
      sku: txt(r,m,'Produto','Codigo','Cod.Produto'),
      descricao: txt(r,m,'Descrição','Descricao'),
      grupo: txt(r,m,'Grupo'), tipo: txt(r,m,'Tipo'),
      unidade: txt(r,m,'UM','Unidade','Un.Medida') || 'UN',
      armazem: txt(r,m,'Armaz.','Armz.','Armazem','Local') || '2',
      lote: txt(r,m,'Lote') || '',
      qtd: qty(r,m,'Saldo Lote','Saldo','Quantidade'),
      empenho: qty(r,m,'Empenho','Empenhado'),
      disponivel: qty(r,m,'Disponível','Disponivel','Saldo Disponivel'),
      valor: qty(r,m,'R$ Tot.Cto.','Custo Total','Valor Total','Valor') }; } },
  entradas: { rotulo:'Entradas (NF de transferência)', map: movRow },
  saidas:   { rotulo:'Saídas (NF emitidas)',           map: movRow }
};

function detectSheet(headers, sheetName){
  const h = headers.map(norm), n = norm(sheetName);
  const has = (...ks) => ks.every(k => h.includes(norm(k)));
  // Entradas e Saidas têm cabeçalho idêntico no ERP: o nome da aba desempata
  if(has('Emissão','TES') || has('Emissao','TES'))
    return /said/.test(n) ? 'saidas' : 'entradas';
  if(has('Produto','Saldo Lote') || has('Produto','Saldo')) return 'saldo_erp';
  return null;
}

async function handleFile(file){
  if(!file) return;
  const alvo = $('#prev');
  try{
    if(alvo) alvo.innerHTML = '<div class="load"><span class="spin"></span>Lendo o arquivo…</div>';
    await ensureLib(() => window.XLSX, LIB_XLSX, 'SheetJS (leitura de Excel)');
    await lerArquivo(file);
  }catch(e){
    console.error(e);
    if(alvo) alvo.innerHTML = `<div class="panel"><div class="pb"><div class="msg err" style="display:block">
      <b>Não consegui ler o arquivo.</b><br>${esc(e.message||e)}<br>
      <span style="opacity:.8">Se persistir, abra o console do navegador (F12) e me mande o erro.</span>
    </div></div></div>`;
    toast(e.message || 'Falha ao ler o arquivo', 'err');
  }
}

async function lerArquivo(file){
  const buf = await file.arrayBuffer();
  const b = new Uint8Array(buf);
  /* A extensão mente: muito ERP exporta texto puro com nome .xls, e aí o leitor
     entra no modo planilha e "adivinha" os números no padrão americano —
     9.300 vira 9,3 antes de qualquer código meu rodar. Por isso a decisão é pela
     assinatura do arquivo: PK = xlsx (zip), D0CF = xls binário antigo, resto = texto. */
  const ehZip   = b[0]===0x50 && b[1]===0x4B;
  const ehOle   = b[0]===0xD0 && b[1]===0xCF;
  const ehTexto = !ehZip && !ehOle;
  // texto: ler tudo como string e converter com as regras de pt-BR
  const opts = ehTexto ? { type:'array', raw:true, codepage:65001 } : { type:'array', cellDates:true };
  let wb = XLSX.read(b, opts);
  if(ehTexto){
    const t = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]).slice(0,2000);
    if(t.includes('�')) wb = XLSX.read(b, { type:'array', raw:true, codepage:1252 });
  }
  window.__fmt = ehZip ? 'xlsx' : ehOle ? 'xls binário' : 'texto/CSV';
  const abas = [];
  wb.SheetNames.forEach(name => {
    const ws = wb.Sheets[name];
    const raw = XLSX.utils.sheet_to_json(ws, { defval:null });
    if(!raw.length) return;
    const tipo = detectSheet(Object.keys(raw[0]), name);
    if(!tipo) { abas.push({ name, tipo:null, raw }); return; }
    const m0 = idx(raw[0]);
    const ehTotal = r => norm(pick(r, idx(r), 'Descrição','Descricao') || '') === 'total';
    const totalRow = raw.find(ehTotal);
    const dados = raw.filter(r => !ehTotal(r))
      .filter(r => { const m = idx(r); return tipo==='saldo_erp' ? pick(r,m,'Produto','Codigo')
                                                                : pick(r,m,'Emissão','Emissao','Data'); })
      .map((r,i) => SHEETS[tipo].map(r,i));
    const mT = totalRow ? idx(totalRow) : null;
    abas.push({ name, tipo, dados,
      checksum: totalRow ? { qtd: qty(totalRow,mT,'Qtd.','Saldo Lote','Quantidade'),
                             valor: qty(totalRow,mT,'R$ Vda.','R$ Tot.Cto.','Valor'),
                             linhas: qty(totalRow,mT,'Filial') } : null });
  });
  renderPreview(file, abas);
}

          <div style="font-size:11.5px;color:var(--tx3);margin-top:4px">Marque apenas na primeira carga. Cria o saldo de partida de cada lote.</div></div>`:''}
        <div style="margin:14px 0 6px;font-size:12.5px;color:var(--tx2)">
          <b>Prévia</b> — mostrando ${nf(Math.min(a.dados.length, 30))} de <b>${nf(a.dados.length)}</b> linha(s).
          A importação vai gravar <b>todas as ${nf(a.dados.length)}</b>, não apenas as visíveis aqui.
        </div>
        <div class="scroll" style="max-height:300px"><table>
          <thead><tr>${Object.keys(a.dados[0]).map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead>
          <tbody>${a.dados.slice(0,30).map(r=>`<tr>${Object.values(r).map(v=>`<td>${esc(v==null?'—':v)}</td>`).join('')}</tr>`).join('')}
            ${a.dados.length>30?`<tr><td colspan="${Object.keys(a.dados[0]).length}" class="empty">
              e mais ${nf(a.dados.length-30)} linha(s) que serão importadas normalmente</td></tr>`:''}
          </tbody>
        </table></div>
        <div style="margin-top:14px">
          <button class="btn" ${bloqueia?'disabled':''} data-go="${esc(a.name)}">Confirmar importação de ${nf(a.dados.length)} linha(s)</button>
        </div>
      </div></div>`;
  }
  $('#prev').innerHTML = html;
  validas.forEach(a => {
    const b = $(`[data-go="${CSS.escape(a.name)}"]`); if(!b) return;
    b.dataset.rotulo = b.textContent;
    b.onclick = () => runImport(file, a, b);
    const sel = $(`#tp_${CSS.escape(a.name)}`);
    if(sel){
      const sincroniza = () => {
        const wrapCc = $(`#wrap_cc_${CSS.escape(a.name)}`);
        const wrapTr = $(`#wrap_tr_${CSS.escape(a.name)}`);
        if(wrapCc) wrapCc.style.display = sel.value==='DEVOLUCAO' ? '' : 'none';
        if(wrapTr) wrapTr.style.display = sel.value==='ENTRADA' ? '' : 'none';
      };
      sel.onchange = sincroniza; sincroniza();
    }
  });
}

async function runImport(file, aba, btn){
  const mzRef = window.__mzRef || null;
  btn.disabled = true; btn.textContent = 'Importando…';
  $('#s3').className='step on';
  try{
    const { data:batch, error:e1 } = await sb.from('import_batches').insert({
      branch_id:S.branch, tipo:aba.tipo, arquivo_nome:file.name, aba:aba.name,
      total_linhas:aba.dados.length, checksum_qtd:aba.checksum?.qtd ?? null,
      checksum_valor:aba.checksum?.valor ?? null, checksum_ok:true, user_id:S.user.id
    }).select().single();
    if(e1) throw e1;

    const CH = 300; let acc = { inseridos:0, atualizados:0, duplicados:0, erros:0, detalhe:[], snapshot:null };
    for(let i=0;i<aba.dados.length;i+=CH){
      const chunk = aba.dados.slice(i,i+CH);
      btn.textContent = `Importando… ${Math.min(i+CH, aba.dados.length)}/${aba.dados.length}`;
      let res;
      if(aba.tipo==='saldo_erp'){
        const mz = !!$(`#mz_${CSS.escape(aba.name)}`)?.checked;
        const dref = $(`#dr_${CSS.escape(aba.name)}`)?.value || new Date().toISOString().slice(0,10);
        res = await sb.rpc('fn_import_erp_snapshot', { p_batch:batch.id, p_rows:chunk,
          p_data_ref:dref, p_marco_zero:mz, p_snapshot:acc.snapshot||null });
        if(res.error) throw res.error;
        acc.snapshot = res.data.snapshot_id;      // blocos seguintes gravam na MESMA fotografia
        acc.inseridos += res.data.itens||0;
      }else if(aba.tipo==='produtos'){
        res = await sb.rpc('fn_import_products', { p_batch:batch.id, p_rows:chunk });
        if(res.error) throw res.error;
        acc.inseridos += res.data.inseridos||0; acc.atualizados += res.data.atualizados||0; acc.erros += res.data.erros||0;
      }else{
        const tipoDecl = $(`#tp_${CSS.escape(aba.name)}`)?.value || (aba.tipo==='entradas'?'ENTRADA':'SAIDA');
        const transito = !!$(`#tr_${CSS.escape(aba.name)}`)?.checked;
        // devolução de venda pré-Marco Zero não pode abater consumo: a saída nunca foi contada
        const semConsumo = tipoDecl==='DEVOLUCAO' && !!$(`#cc_${CSS.escape(aba.name)}`)?.checked;
        const criarProd = !!$(`#cp_${CSS.escape(aba.name)}`)?.checked;
        // linhas anteriores ao Marco Zero podem ser registradas na data de recebimento
        const usarReceb = !!$(`#dr_mz_${CSS.escape(aba.name)}`)?.checked;
        const dataReceb = $(`#dr_dt_${CSS.escape(aba.name)}`)?.value;
        const linhas = (usarReceb && dataReceb && mzRef)
          ? chunk.map(l => (l.data && l.data <= mzRef) ? { ...l, data: dataReceb } : l)
          : chunk;
        res = await sb.rpc('fn_import_movements', { p_batch:batch.id, p_rows:linhas,
          p_tipo:tipoDecl, p_em_transito:transito,
          p_conta_consumo: semConsumo ? false : null,
          p_criar_produto: criarProd });
        if(res.error) throw res.error;
        acc.inseridos += res.data.inseridos||0; acc.duplicados += res.data.duplicados||0; acc.erros += res.data.erros||0;
        acc.criados = (acc.criados||0) + (res.data.produtos_criados||0);
        (res.data.skus_criados||[]).forEach(sk => (acc.skus = acc.skus||[]).push(sk));
        (res.data.detalhe_erros||[]).forEach(d => acc.detalhe.length<20 && acc.detalhe.push(d));
      }
    }
    await sb.from('import_batches').update({ total_linhas:aba.dados.length, linhas_ok:acc.inseridos,
      linhas_duplicadas:acc.duplicados, linhas_erro:acc.erros, status:'confirmada' }).eq('id',batch.id);

    $('#s3').className='step done';
    modal('Importação concluída', `
      <div class="cards">
        <div class="card ok"><div class="lb">Gravados</div><div class="vl">${nf(acc.inseridos)}</div></div>
        <div class="card"><div class="lb">Já existiam</div><div class="vl">${nf(acc.duplicados)}</div><div class="ft">ignorados pela idempotência</div></div>
        <div class="card ${acc.erros?'bad':''}"><div class="lb">Recusados</div><div class="vl">${nf(acc.erros)}</div></div>
        ${acc.criados?`<div class="card info"><div class="lb">Produtos criados</div><div class="vl">${nf(acc.criados)}</div>
          <div class="ft">${esc((acc.skus||[]).slice(0,4).join(', '))}${(acc.skus||[]).length>4?'…':''}</div></div>`:''}
      </div>
      ${acc.criados?`<div class="hint">Os produtos criados nasceram <b>sem custo</b> e marcados como
        <b>auto_importado</b>. Se algum deles for ficar em estoque de verdade, importe o Estoque Atual
        para trazer descrição, unidade e custo corretos.</div>`:''}
      ${acc.detalhe.length?`<div class="panel" style="margin-top:8px"><div class="ph"><h3>Linhas recusadas</h3></div>
        <div class="pb flush"><div class="scroll" style="max-height:280px"><table><thead><tr><th>Linha</th><th>Motivo</th></tr></thead>
        <tbody>${acc.detalhe.map(d=>`<tr><td>${esc(d.linha)}</td><td>${esc(d.erro)}</td></tr>`).join('')}</tbody></table></div></div></div>`:''}
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn" onclick="document.querySelector('.modal').remove(); route()">Continuar importando</button>
        <button class="btn gh" onclick="location.hash='movimentos';document.querySelector('.modal').remove()">Ver movimentações</button>
      </div>`, true);
  }catch(e){ err(e); btn.disabled=false; btn.textContent = btn.dataset.rotulo || 'Confirmar importação'; }
}

window.conferir = (id, doc, sku, qtd) => {
  const m = modal('Conferência de recebimento', `
    <div class="hint">Informe a quantidade <b>fisicamente recebida</b>. Se for diferente da NF, o sistema registra a divergência
    no ato e ela passa a constar nos alertas — é assim que a falta na transferência deixa de virar "sumiço" na filial.</div>
    <dl class="kv" style="margin-bottom:18px">
      <dt>Nota fiscal</dt><dd class="mono">${esc(doc)}</dd>
      <dt>Produto</dt><dd class="mono">${esc(sku)}</dd>
      <dt>Quantidade da NF</dt><dd>${nf(qtd)}</dd></dl>
    <div class="fld"><label>Quantidade recebida</label><input id="qr" type="number" step="0.0001" value="${qtd}"></div>
    <div class="fld"><label>Observação</label><textarea id="ob" rows="2" placeholder="opcional"></textarea></div>
    <div id="dv" style="margin:10px 0 16px;font-size:13px"></div>
    <button class="btn" id="ok">Registrar recebimento</button>`);
  const calc = () => { const d = Number(m.querySelector('#qr').value||0) - qtd;
    m.querySelector('#dv').innerHTML = d===0 ? '<span class="tag t-ok">sem divergência</span>'
      : `<span class="tag t-bad">divergência de ${nf(d)}</span>`; };
  m.querySelector('#qr').oninput = calc; calc();
  m.querySelector('#ok').onclick = async () => {
    const { data, error } = await sb.rpc('fn_confirmar_recebimento', {
      p_movement:id, p_qtd_recebida:Number(m.querySelector('#qr').value||0),
      p_observacao:m.querySelector('#ob').value||null });
    if(error) return err(error);
    m.remove();
    toast(data.divergencia===0 ? 'Recebimento confirmado e saldo atualizado.'
      : `Recebimento registrado com divergência de ${nf(data.divergencia)}. Já está nos alertas.`);
    route();
  };
};

ROUTES.divergencias = async () => {

  let rec;
  if(rid) ({ data:rec } = await sb.from('reconciliations').select('*').eq('id',rid).maybeSingle());
  else ({ data:rec } = await sb.from('reconciliations').select('*').order('data_execucao',{ascending:false}).limit(1).maybeSingle());
  if(!rec){ $('#view').innerHTML = header('Divergências') + '<div class="panel"><div class="empty">Nenhuma conciliação executada ainda.</div></div>'; return; }

  const items = await fetchAll(() => sb.from('reconciliation_items').select('*')
    .eq('reconciliation_id',rec.id).neq('classificacao','conforme')
    .order('impacto_valor',{ascending:true}));

  const LB = { div_negativa:['Divergência negativa','t-bad'], div_positiva:['Divergência positiva','t-warn'],
    div_critica:['Crítica','t-bad'], item_fantasma:['Item fantasma','t-info'], item_invisivel:['Item invisível','t-info'] };
  const perda = items.filter(i=>i.impacto_valor<0).reduce((a,i)=>a+Number(i.impacto_valor),0);
  const ganho = items.filter(i=>i.impacto_valor>0).reduce((a,i)=>a+Number(i.impacto_valor),0);

  $('#view').innerHTML = header(`Divergências — ${esc(rec.codigo)}`,
    'Divergência não é furto. É diferença que precisa ser investigada — o sistema mostra as evidências, a conclusão é sua.',
    `<button class="btn gh sm" id="exp">Exportar Excel</button>`) + `
  <div class="cards">
    <div class="card"><div class="lb">Itens analisados</div><div class="vl">${nf(rec.total_itens)}</div></div>
    <div class="card bad"><div class="lb">Divergentes</div><div class="vl">${nf(rec.itens_divergentes)}</div></div>
    <div class="card bad"><div class="lb">Falta (ERP &gt; sistema)</div><div class="vl" style="font-size:19px">${money(perda)}</div></div>
    <div class="card warn"><div class="lb">Sobra (sistema &gt; ERP)</div><div class="vl" style="font-size:19px">${money(ganho)}</div></div>
    <div class="card ${rec.acuracidade_itens>=0.98?'ok':'warn'}"><div class="lb">Acuracidade de itens</div>
      <div class="vl">${rec.acuracidade_itens===null?'—':pct(rec.acuracidade_itens*100)}</div></div>
    <div class="card"><div class="lb">Acuracidade financeira</div>
      <div class="vl">${rec.acuracidade_financeira===null?'—':pct(rec.acuracidade_financeira*100)}</div></div>
  </div>
  <div class="filters">
    <div class="fld" style="min-width:240px"><label>Buscar</label><input id="q" placeholder="código, descrição ou lote"></div>
    <div class="fld"><label>Classificação</label><select id="cl"><option value="">Todas</option>
      ${Object.entries(LB).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></div>
    <div class="fld"><label>Impacto mínimo (R$)</label><input id="vmin" type="number" value="0" style="width:150px"></div>
  </div>
  <div class="panel"><div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Código</th><th>Descrição</th><th>Lote</th><th class="num">Saldo ERP</th>
      <th class="num">Saldo sistema</th><th class="num">Diferença</th><th class="num">%</th>
      <th class="num">Custo unit.</th><th class="num">Impacto R$</th><th>Classificação</th><th></th></tr></thead>
    <tbody id="tb"></tbody></table></div></div></div>`;

  const draw = () => {
    const q=$('#q').value.toLowerCase(), cl=$('#cl').value, vmin=Number($('#vmin').value||0);
    const f = items.filter(i =>
      (!q || (i.sku+' '+(i.descricao||'')+' '+(i.numero_lote||'')).toLowerCase().includes(q)) &&
      (!cl || i.classificacao===cl) && (Math.abs(Number(i.impacto_valor)) >= vmin));
    $('#tb').innerHTML = f.length ? f.slice(0,800).map(i=>`<tr>
      <td class="mono">${esc(i.sku)}</td><td>${esc(i.descricao||'—')}</td><td class="mono">${esc(i.numero_lote||'—')}</td>
      <td class="num">${nf(i.qtd_erp)}</td><td class="num">${nf(i.qtd_calculada)}</td>

      <td><a style="cursor:pointer" onclick="investigar('${i.id}')">investigar</a>${i.product_id?` · <a style="cursor:pointer" onclick="location.hash='produto?id=${i.product_id}'">x-ray</a>`:''}</td>
    </tr>`).join('') : '<tr><td colspan="11" class="empty">Nenhuma divergência com esses filtros.</td></tr>';
  };
  draw(); ['q','cl','vmin'].forEach(i=>{ $('#'+i).oninput=draw; $('#'+i).onchange=draw; });
  window.__divs = items;
  $('#exp').onclick = () => toXlsx(items.map(i=>({Codigo:i.sku,Descricao:i.descricao,Lote:i.numero_lote,
    SaldoERP:i.qtd_erp,SaldoSistema:i.qtd_calculada,Diferenca:i.diferenca,PercDiferenca:i.perc_diferenca,
    CustoUnit:i.custo_unitario,ImpactoRS:i.impacto_valor,Classificacao:i.classificacao})), `divergencias-${rec.codigo}.xlsx`);
