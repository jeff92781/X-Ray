/* =========================================================
   GIRO E COBERTURA — quanto sai por período e há quanto tempo o saldo está parado
   Resolve o problema do lote genérico: a idade vem do fluxo (FIFO), não do lote.
   ========================================================= */
ROUTES.giro = async () => {
  const meses = Number(S.settings.consumo_meses || 3);
  const data = await rpcAll('fn_giro', { p_meses: meses });
  const comSaldo = data.filter(r => Number(r.qtd_atual) > 0);

  const cont = st => comSaldo.filter(r=>r.status===st).length;
  const valor = st => comSaldo.filter(r=>r.status===st).reduce((a,r)=>a+Number(r.valor_atual||0),0);
  const semRastreio = comSaldo.filter(r=>r.sem_rastreio).length;
  const semIdade = comSaldo.filter(r=>!r.idade_confiavel).length;

  const CL = { CRITICO:'t-bad', BAIXO:'t-warn', ADEQUADO:'t-ok', EXCESSO:'t-info', 'SEM GIRO':'t-mut', 'SEM DADOS':'t-mut' };

  $('#view').innerHTML = header('Giro e cobertura',
    `Quanto sai por mês de cada item, para quantos meses o saldo dá, e há quantos dias esse saldo está parado. Consumo médio dos últimos ${meses} meses.`,
    `<button class="btn gh sm" id="exp">Exportar Excel</button>`) + `
  <div class="cards">
    <div class="card bad"><div class="lb">Crítico</div><div class="vl">${nf(cont('CRITICO'))}</div>
      <div class="ft">menos de meio mês de cobertura</div></div>
    <div class="card warn"><div class="lb">Baixo</div><div class="vl">${nf(cont('BAIXO'))}</div>
      <div class="ft">${money(valor('BAIXO'))}</div></div>
    <div class="card ok"><div class="lb">Adequado</div><div class="vl">${nf(cont('ADEQUADO'))}</div>
      <div class="ft">${money(valor('ADEQUADO'))}</div></div>
    <div class="card info"><div class="lb">Excesso</div><div class="vl">${nf(cont('EXCESSO'))}</div>
      <div class="ft">${money(valor('EXCESSO'))} acima de 2 meses</div></div>
    <div class="card"><div class="lb">Sem giro</div><div class="vl">${nf(cont('SEM GIRO'))}</div>
      <div class="ft">${money(valor('SEM GIRO'))} sem saída no período</div></div>
  </div>

  ${semIdade ? `<div class="hint"><b>${nf(semIdade)} produto(s) com idade parcial.</b>
    A idade é calculada alocando o saldo atual nas entradas mais recentes — quando as entradas conhecidas
    não cobrem todo o saldo, o restante veio do Marco Zero e a idade real é maior que a exibida.
    Isso se resolve sozinho conforme os meses de importação forem se acumulando.</div>` : ''}
  ${semRastreio ? `<div class="hint"><b>${nf(semRastreio)} produto(s) usam só lote genérico</b> (R100, S/L).
    Neles a idade do lote não significaria nada, porque o balde nunca zera — por isso esta tela mede a idade
    pelo fluxo de entradas e saídas, e não pelo lote. É o número em que confiar para esses itens.</div>` : ''}

  <div class="filters">
    <div class="fld" style="min-width:250px"><label>Buscar</label><input id="q" placeholder="código ou descrição"></div>
    <div class="fld"><label>Situação</label><select id="st"><option value="">Todas</option>
      ${['CRITICO','BAIXO','ADEQUADO','EXCESSO','SEM GIRO'].map(x=>`<option>${x}</option>`).join('')}</select></div>
    <div class="fld"><label>Ordenar por</label><select id="or">
      <option value="valor">Valor em estoque</option><option value="idade">Idade do saldo</option>
      <option value="cob">Cobertura</option><option value="cons">Consumo médio</option></select></div>
  </div>

  <div class="panel"><div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Código</th><th>Descrição</th><th class="num">Saldo</th><th class="num">Valor</th>
      <th class="num">Saída/mês</th><th class="num">Saída no período</th><th class="num">Cobertura</th>
      <th>Situação</th><th class="num">Idade do saldo</th><th class="num">Sem saída há</th></tr></thead>
    <tbody id="tb"></tbody></table></div></div></div>`;

  const draw = () => {
    const q = $('#q').value.toLowerCase(), st = $('#st').value, or = $('#or').value;
    let f = comSaldo.filter(r => (!q || (r.sku+' '+r.descricao).toLowerCase().includes(q)) && (!st || r.status===st));
    const num = v => Number(v ?? -1);
    f.sort((a,b) => or==='idade' ? num(b.idade_media_dias)-num(a.idade_media_dias)
                  : or==='cob'   ? num(b.cobertura_meses)-num(a.cobertura_meses)
                  : or==='cons'  ? num(b.consumo_medio)-num(a.consumo_medio)
                  : num(b.valor_atual)-num(a.valor_atual));
    $('#tb').innerHTML = f.length ? f.slice(0,800).map(r=>`<tr>
      <td class="mono"><a style="cursor:pointer" onclick="location.hash='produto?id=${r.product_id}'">${esc(r.sku)}</a>${r.sem_rastreio?' <span class="tag t-mut" title="Só lote genérico">S/L</span>':''}</td>
      <td>${esc(r.descricao)}</td>
      <td class="num">${nf(r.qtd_atual)}</td><td class="num">${money(r.valor_atual)}</td>
      <td class="num">${nf(r.consumo_medio)}</td><td class="num">${nf(r.saidas_periodo)}</td>
      <td class="num">${r.cobertura_meses===null?'—':nf(r.cobertura_meses,1)+' m'}</td>
      <td><span class="tag ${CL[r.status]||'t-mut'}">${esc(r.status)}</span></td>
      <td class="num">${r.idade_media_dias===null?'—':nf(r.idade_media_dias,0)+' d'}${r.idade_confiavel?'':' <span class="tag t-mut" title="Entradas conhecidas não cobrem todo o saldo">parcial</span>'}</td>
      <td class="num">${r.dias_sem_saida===null?'—':nf(r.dias_sem_saida)+' d'}</td>
    </tr>`).join('') : '<tr><td colspan="10" class="empty">Nada com esses filtros.</td></tr>';
  };
  draw(); ['q','st','or'].forEach(i => { on('#'+i,'input',draw); on('#'+i,'change',draw); });
  on('#exp','click', () => toXlsx(comSaldo.map(r=>({Codigo:r.sku,Descricao:r.descricao,Saldo:r.qtd_atual,
    Valor:r.valor_atual,ConsumoMedioMes:r.consumo_medio,SaidaNoPeriodo:r.saidas_periodo,
    CoberturaMeses:r.cobertura_meses,Situacao:r.status,IdadeSaldoDias:r.idade_media_dias,
    IdadeConfiavel:r.idade_confiavel?'SIM':'PARCIAL',DiasSemSaida:r.dias_sem_saida,
    SoLoteGenerico:r.sem_rastreio?'SIM':'NAO'})), 'giro-e-cobertura.xlsx'));
};

/* =========================================================

  $('#view').innerHTML = header('Inventário',
    'A contagem é <b>por lote</b>: cada lote é uma linha independente. A contagem sozinha não altera o saldo — o ajuste só nasce na aprovação, e é isso que impede quem conta de fechar a própria diferença.',
    can('admin','auditor','operacional') ? `<button class="btn" id="novo">Novo inventário</button>` : '') + `
  ${abertos.length ? `<div class="hint">Você tem <b>${nf(abertos.length)}</b> inventário(s) em andamento.
    O saldo esperado de cada item foi congelado no momento da abertura — contar amanhã não muda a base de comparação.</div>` : ''}
  <div class="panel"><div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Código</th><th>Tipo</th><th>Corte</th><th>Situação</th>
      <th class="num">Itens</th><th class="num">Contados</th><th class="num">Divergentes</th>
      <th class="num">Impacto R$</th><th>Aberto por</th><th></th></tr></thead>
    <tbody>${data.length ? data.map(i=>`<tr>
      <td class="mono">${esc(i.codigo)}</td><td>${esc(i.tipo)}</td><td>${dts(i.data_hora_corte)}</td>
      <td><span class="tag ${i.status==='aprovado'?'t-ok':i.status==='cancelado'?'t-mut':'t-warn'}">${esc(i.status.replace('_',' '))}</span></td>
      <td class="num">${nf(i.itens)}</td><td class="num">${nf(i.contados)}</td>
      <td class="num ${i.divergentes?'neg':''}">${nf(i.divergentes)}</td>
      <td class="num ${sgn(i.impacto_valor)}">${money(i.impacto_valor)}</td>
      <td>${esc(i.criado_por||'—')}</td>
      <td><a style="cursor:pointer" onclick="location.hash='inventario?i=${i.id}'">${i.status==='aprovado'?'ver':'contar'}</a></td>
    </tr>`).join('') : '<tr><td colspan="10" class="empty">Nenhum inventário ainda.</td></tr>'}</tbody>
  </table></div></div></div>`;

  on('#novo','click', async () => {
    const lotes = await rpcAll('fn_lotes_para_inventario', { p_apenas_com_saldo:true });
    abrirSeletorDeLotes({
      titulo: 'Novo inventário',
      lotes,
      rodape: `
        <div class="filters" style="margin-bottom:0">
          <div class="fld"><label>Tipo</label><select id="tp">
            <option value="pontual">Pontual — alguns lotes</option>
            <option value="ciclico">Cíclico — contagem rotativa</option>
            <option value="geral">Geral — todos os lotes com saldo</option></select></div>
          <div class="fld" style="flex:1;min-width:240px"><label>Observação</label>
            <input id="obs" placeholder="ex.: contagem do corredor A"></div>
        </div>`,
      rotuloBotao: 'Abrir inventário',
      acao: async (m, escolhidos) => {
        const tipo = m.querySelector('#tp').value;
        if(tipo !== 'geral' && !escolhidos.length){
          toast('Escolha pelo menos um lote — ou selecione o tipo Geral.', 'err'); return false;
        }
        const { data:novoId, error } = await sb.rpc('fn_open_inventory', {
          p_tipo: tipo, p_observacao: m.querySelector('#obs').value || null,
          p_products: null, p_lots: tipo === 'geral' ? null : escolhidos });
        if(error){ err(error); return false; }
        location.hash = 'inventario?i=' + novoId;
        return true;
      }
    });
  });
};

/* Seletor de lotes: o inventário é contado POR LOTE, então a escolha também é.
   Um produto com cinco lotes vira cinco contagens independentes — e contar um
   lote não obriga a contar os outros quatro. */
function abrirSeletorDeLotes({ titulo, lotes, rodape = '', rotuloBotao, acao }){
  const m = modal(titulo, `
    <div class="hint">O saldo esperado de cada lote é <b>congelado agora</b>, no instante da abertura.
    Se o estoque se mexer enquanto você conta, a comparação continua justa.</div>
    <div class="filters" style="margin-bottom:10px">
      <div class="fld" style="flex:1;min-width:260px"><label>Filtrar</label>
        <input id="fl" placeholder="código, descrição ou número do lote" autocomplete="off"></div>
      <div class="fld"><label>Mostrar</label><select id="ord">
        <option value="sku">Por código</option>
        <option value="valor">Maior valor parado</option>
        <option value="idade">Mais antigos</option>
        <option value="inv">Há mais tempo sem inventário</option></select></div>
      <div class="fld"><label>&nbsp;</label><button class="btn gh sm" id="todos">Marcar os visíveis</button></div>
    </div>
    <div id="resumoSel" style="font-size:12.5px;color:var(--tx2);margin-bottom:8px"></div>
    <div class="scroll" style="max-height:340px;border:1px solid var(--line);border-radius:9px">
      <table><thead><tr><th style="width:34px"></th><th>Código</th><th>Descrição</th><th>Lote</th>
        <th class="num">Saldo</th><th class="num">Valor</th><th class="num">Dias</th>
        <th class="num">S/ invent.</th></tr></thead>
      <tbody id="tbLotes"></tbody></table>
    </div>
    ${rodape}
    <div style="margin-top:16px"><button class="btn" id="okSel">${esc(rotuloBotao)}</button></div>`, true);

  const marcados = new Set();
  let visiveis = [];

  const desenhar = () => {
    const q = m.querySelector('#fl').value.toLowerCase().trim();
    const ord = m.querySelector('#ord').value;
    visiveis = lotes.filter(l => !q ||
      (l.sku + ' ' + l.descricao + ' ' + l.numero_lote).toLowerCase().includes(q));
    const n = v => Number(v ?? -1);
    visiveis.sort((a,b) => ord==='valor' ? n(b.valor_atual)-n(a.valor_atual)
                        : ord==='idade' ? n(b.dias_em_estoque)-n(a.dias_em_estoque)
                        : ord==='inv'   ? n(b.dias_sem_inventario)-n(a.dias_sem_inventario)
                        : String(a.sku+a.numero_lote).localeCompare(String(b.sku+b.numero_lote)));

    const limite = 600, cortou = visiveis.length > limite;
    m.querySelector('#tbLotes').innerHTML = visiveis.length ? visiveis.slice(0,limite).map(l=>`
      <tr data-lot="${l.lot_id}" style="cursor:pointer">
        <td><input type="checkbox" ${marcados.has(l.lot_id)?'checked':''} style="width:auto"></td>
        <td class="mono">${esc(l.sku)}</td><td>${esc(l.descricao)}</td>
        <td class="mono">${esc(l.numero_lote)}${l.lote_generico?' <span class="tag t-mut">genérico</span>':''}</td>
        <td class="num">${nf(l.qtd_atual)}</td><td class="num">${money(l.valor_atual)}</td>
        <td class="num">${nf(l.dias_em_estoque)}</td>
        <td class="num">${l.dias_sem_inventario===null?'nunca':nf(l.dias_sem_inventario)}</td>
      </tr>`).join('')
      : '<tr><td colspan="8" class="empty">Nenhum lote com esse filtro.</td></tr>';
    if(cortou) m.querySelector('#tbLotes').insertAdjacentHTML('beforeend',
      `<tr><td colspan="8" class="empty">Mostrando ${nf(limite)} de ${nf(visiveis.length)} lotes.
        Use o filtro para chegar no que procura — os demais continuam disponíveis.</td></tr>`);

    m.querySelectorAll('#tbLotes tr[data-lot]').forEach(tr => {
      tr.onclick = e => {
        const id = tr.dataset.lot;
        marcados.has(id) ? marcados.delete(id) : marcados.add(id);
        tr.querySelector('input').checked = marcados.has(id);
        resumir();
        if(e.target.tagName === 'INPUT') e.stopPropagation();
      };
    });
    resumir();
  };

  const resumir = () => {
    const sel = lotes.filter(l => marcados.has(l.lot_id));
    const valor = sel.reduce((a,l)=>a+Number(l.valor_atual||0),0);
    const prods = new Set(sel.map(l=>l.product_id)).size;
    m.querySelector('#resumoSel').innerHTML = marcados.size
      ? `<b>${nf(marcados.size)} lote(s)</b> de ${nf(prods)} produto(s) · ${money(valor)} a conferir
         · <a style="cursor:pointer" id="limpar">limpar seleção</a>`
      : `${nf(visiveis.length)} lote(s) na lista · nenhum marcado ainda`;
    const lp = m.querySelector('#limpar');
    if(lp) lp.onclick = () => { marcados.clear(); desenhar(); };
  };

  m.querySelector('#fl').oninput = desenhar;
  m.querySelector('#ord').onchange = desenhar;
  m.querySelector('#todos').onclick = () => {
    const todosMarcados = visiveis.every(l => marcados.has(l.lot_id));
    visiveis.slice(0,600).forEach(l => todosMarcados ? marcados.delete(l.lot_id) : marcados.add(l.lot_id));
    desenhar();
  };
  m.querySelector('#okSel').onclick = async () => {
    const btn = m.querySelector('#okSel'); btn.disabled = true;
    const ok = await acao(m, [...marcados]);
    if(ok) m.remove(); else btn.disabled = false;
  };
  desenhar();
  setTimeout(()=>m.querySelector('#fl').focus(), 60);
}

async function telaContagem(invId){
  const [{data:inv}, itens] = await Promise.all([
    sb.from('v_inventarios').select('*').eq('id',invId).maybeSingle(),
    fetchAll(() => sb.from('v_inventario_itens').select('*').eq('inventory_id',invId).order('sku'))
  ]);
  if(!inv) return err(new Error('Inventário não encontrado'));
  const fechado = ['aprovado','cancelado'].includes(inv.status);
  const podeAprovar = can('admin','auditor') && !fechado;

  $('#view').innerHTML = header(`${esc(inv.codigo)} <span class="tag ${fechado?'t-ok':'t-warn'}" style="font-size:12px;vertical-align:3px">${esc(inv.status.replace('_',' '))}</span>`,
    `Corte em ${dts(inv.data_hora_corte)} · aberto por ${esc(inv.criado_por||'—')}${inv.aprovado_por?` · aprovado por ${esc(inv.aprovado_por)}`:''}`,
    `<button class="btn gh sm" onclick="location.hash='inventario'">Voltar</button>
     <button class="btn gh sm" id="exp">Exportar Excel</button>
     ${!fechado?`<button class="btn gh sm" id="addLotes">Acrescentar lotes</button>`:''}
     ${podeAprovar?`<button class="btn gh sm dg" id="cancelar">Cancelar inventário</button>
     <button class="btn" id="aprovar">Aprovar e gerar ajustes</button>`:''}`) + `
  <div class="cards">
    <div class="card"><div class="lb">Itens</div><div class="vl">${nf(inv.itens)}</div></div>
    <div class="card"><div class="lb">Contados</div><div class="vl">${nf(inv.contados)}</div>
      <div class="ft">${nf(inv.itens - inv.contados)} pendentes</div></div>
    <div class="card ${inv.divergentes?'bad':'ok'}"><div class="lb">Divergentes</div><div class="vl">${nf(inv.divergentes)}</div></div>
    <div class="card ${inv.impacto_valor<0?'bad':inv.impacto_valor>0?'warn':''}"><div class="lb">Impacto</div>
      <div class="vl" style="font-size:19px">${money(inv.impacto_valor)}</div></div>
  </div>
  ${!fechado?`<div class="filters">
    <div class="fld" style="min-width:250px"><label>Buscar</label><input id="q" placeholder="código, descrição ou lote"></div>
    <div class="fld"><label>Mostrar</label><select id="fl">
      <option value="">Todos</option><option value="pend">Pendentes</option>
      <option value="div">Com divergência</option></select></div>
    <div class="fld"><label>&nbsp;</label>
      <label style="font-weight:400;font-size:12.5px"><input type="checkbox" id="cego" style="width:auto;margin-right:6px" checked>
      Contagem às cegas (esconde o esperado)</label></div>
  </div>`:''}
  ${!fechado?`<div class="panel"><div class="pb" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="btn" id="salvarTodos">Salvar todos os preenchidos</button>
    <button class="btn gh sm" id="motivoTodos">Aplicar motivo aos divergentes</button>
    <span id="resumoPend" style="font-size:12.5px;color:var(--tx2);margin-left:auto"></span>
  </div></div>`:''}
  <div class="panel"><div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Código</th><th>Descrição</th><th>Lote</th><th class="num">Esperado</th>
      <th class="num" style="width:130px">Contado</th><th class="num">Divergência</th>
      <th class="num">Impacto R$</th><th style="width:200px">Motivo</th><th>Observação</th><th></th></tr></thead>
    <tbody id="tb"></tbody></table></div></div></div>`;

  const motivos = S.reasons;
  const draw = () => {
    const q = ($('#q')?.value||'').toLowerCase(), fl = $('#fl')?.value||'', cego = $('#cego')?.checked;
    const f = itens.filter(i =>
      (!q || (i.sku+' '+i.descricao+' '+(i.numero_lote||'')).toLowerCase().includes(q)) &&
      (fl!=='pend' || i.counted_qty===null) &&
      (fl!=='div'  || (i.counted_qty!==null && Number(i.divergencia)!==0)));
    $('#tb').innerHTML = f.length ? f.slice(0,600).map(i=>{
      const contado = i.counted_qty!==null;
      const div = contado ? Number(i.divergencia) : null;
      const mostraEsp = !cego || contado || fechado;
      return `<tr data-id="${i.id}">
        <td class="mono">${esc(i.sku)}</td><td>${esc(i.descricao)}</td>
        <td class="mono">${esc(i.numero_lote||'—')}</td>
        <td class="num">${mostraEsp ? nf(i.expected_qty) : '<span class="mut">oculto</span>'}</td>
        <td class="num">${fechado ? nf(i.counted_qty) : `<input type="number" step="0.0001" class="cnt"
              data-esp="${i.expected_qty}"
              value="${contado?i.counted_qty:''}" style="width:110px;text-align:right;background:var(--bg2);
              border:1px solid var(--line);border-radius:6px;padding:5px 8px">`}</td>
        <td class="num ${div===null?'':sgn(div)}">${div===null?'—':nf(div)}</td>
        <td class="num ${div===null?'':sgn(div)}">${contado?money(i.impacto_valor):'—'}</td>
        <td>${fechado ? esc(i.motivo||'—') : `<select class="rsn" style="width:190px;background:var(--bg2);
              border:1px solid var(--line);border-radius:6px;padding:5px 8px">
              <option value="">—</option>
              ${motivos.map(r=>`<option value="${r.id}"${r.id===i.reason_id?' selected':''}>${esc(r.descricao)}</option>`).join('')}
            </select>`}</td>
        <td>${fechado ? esc(i.observacao||'') : `<input class="obs" value="${esc(i.observacao||'')}"
              placeholder="opcional" style="width:170px;background:var(--bg2);border:1px solid var(--line);
              border-radius:6px;padding:5px 8px">`}</td>
        <td>${fechado?'':`<button class="btn sm gh sv">Salvar</button>
              <button class="btn sm gh rm" title="Tirar este item do inventário">✕</button>`}</td>
      </tr>`;}).join('') : '<tr><td colspan="10" class="empty">Nada aqui com esse filtro.</td></tr>';

    if(fechado) return;

    // divergência recalculada ao digitar, antes de gravar
    const pintarLinha = tr => {
      const inp = tr.querySelector('.cnt'); if(!inp) return;
      const esp = Number(inp.dataset.esp||0), v = inp.value;
      const cel = tr.children[5];
      if(v === ''){ cel.textContent = '—'; cel.className = 'num'; return; }
      const d = Number(v) - esp;
      cel.textContent = nf(d);
      cel.className = 'num ' + sgn(d);
      const rsn = tr.querySelector('.rsn');
      if(rsn) rsn.style.borderColor = (d !== 0 && !rsn.value) ? 'var(--bad)' : 'var(--line)';
      resumoPendentes();
    };
    const resumoPendentes = () => {
      const el2 = $('#resumoPend'); if(!el2) return;
      const trs = [...$('#tb').querySelectorAll('tr[data-id]')];
      const preenchidos = trs.filter(t => t.querySelector('.cnt')?.value !== '');
      const semMotivo = preenchidos.filter(t => {
        const inp = t.querySelector('.cnt');
        return Number(inp.value) - Number(inp.dataset.esp||0) !== 0 && !t.querySelector('.rsn').value;
      });
      el2.innerHTML = `${nf(preenchidos.length)} preenchido(s) na tela`
        + (semMotivo.length ? ` · <span class="neg">${nf(semMotivo.length)} sem motivo</span>` : '');
    };

    $('#tb').querySelectorAll('tr[data-id]').forEach(tr => {
      const inp = tr.querySelector('.cnt');
      if(inp){ inp.oninput = () => pintarLinha(tr); pintarLinha(tr); }
      const rsn = tr.querySelector('.rsn');
      if(rsn) rsn.onchange = () => pintarLinha(tr);
    });

    on('#salvarTodos','click', async () => {
      const trs = [...$('#tb').querySelectorAll('tr[data-id]')];
      const pacote = trs.map(tr => {
        const inp = tr.querySelector('.cnt');
        if(!inp || inp.value === '') return null;
        return { item: tr.dataset.id, contado: Number(inp.value),
                 motivo: tr.querySelector('.rsn').value || null,
                 observacao: tr.querySelector('.obs').value || null,
                 sku: tr.children[0].textContent.trim() };
      }).filter(Boolean);

      if(!pacote.length) return toast('Nenhuma quantidade preenchida nesta tela.', 'err');
      const btn = $('#salvarTodos'); btn.disabled = true; btn.textContent = 'Gravando…';
      const { data, error } = await sb.rpc('fn_count_items_batch', { p_itens: pacote });
      btn.disabled = false; btn.textContent = 'Salvar todos os preenchidos';
      if(error) return err(error);

      if(data.recusados){
        modal('Contagem gravada com pendências', `
          <div class="cards">
            <div class="card ok"><div class="lb">Gravados</div><div class="vl">${nf(data.gravados)}</div></div>
            <div class="card bad"><div class="lb">Recusados</div><div class="vl">${nf(data.recusados)}</div></div>
          </div>
          <div class="panel" style="margin-top:8px"><div class="pb flush"><div class="scroll" style="max-height:280px">
            <table><thead><tr><th>Item</th><th>Motivo da recusa</th></tr></thead>
            <tbody>${(data.erros||[]).map(e=>`<tr><td class="mono">${esc(e.sku||'—')}</td><td>${esc(e.erro)}</td></tr>`).join('')}</tbody>
            </table></div></div></div>`, true);
      } else {
        toast(`${nf(data.gravados)} contagem(ns) gravada(s).`);
      }
      route();
    });

    on('#motivoTodos','click', () => {
      const mm = modal('Aplicar motivo aos divergentes', `
        <div class="hint">Preenche o motivo de todas as linhas <b>desta tela</b> que estão com divergência
        e ainda sem motivo. Você pode ajustar caso a caso depois.</div>
        <div class="fld"><label>Motivo</label><select id="mtSel">
          ${S.reasons.map(r=>`<option value="${r.id}">${esc(r.descricao)}</option>`).join('')}</select></div>
        <button class="btn" id="mtOk">Aplicar</button>`);
      mm.querySelector('#mtOk').onclick = () => {
        const val = mm.querySelector('#mtSel').value;
        let n = 0;
        $('#tb').querySelectorAll('tr[data-id]').forEach(tr => {
          const inp = tr.querySelector('.cnt'), rsn = tr.querySelector('.rsn');
          if(!inp || inp.value === '' || !rsn) return;
          if(Number(inp.value) - Number(inp.dataset.esp||0) !== 0 && !rsn.value){ rsn.value = val; n++; pintarLinha(tr); }
        });
        mm.remove(); toast(`Motivo aplicado a ${nf(n)} linha(s). Agora use Salvar todos.`);
      };
    });

    $('#tb').querySelectorAll('tr[data-id]').forEach(tr => {
      const btn = tr.querySelector('.sv'); if(!btn) return;
      const rm = tr.querySelector('.rm');
      if(rm) rm.onclick = async () => {
        if(!confirm('Tirar este item do inventário? Ele volta a não estar sendo contado.')) return;
        const { error } = await sb.rpc('fn_remove_inventory_item', { p_item: tr.dataset.id });
        if(error) return err(error);
        const i = itens.findIndex(x=>x.id===tr.dataset.id); if(i>=0) itens.splice(i,1);
        toast('Item removido do inventário.'); draw();
      };
      btn.onclick = async () => {
        const id = tr.dataset.id;
        const v = tr.querySelector('.cnt').value;
        if(v==='') return toast('Informe a quantidade contada.','err');
        btn.disabled = true;
        const { error } = await sb.rpc('fn_count_item', {
          p_item:id, p_counted:Number(v),
          p_reason: tr.querySelector('.rsn').value || null,
          p_observacao: tr.querySelector('.obs').value || null });
        btn.disabled = false;
        if(error) return err(error);
        const it = itens.find(x=>x.id===id);
        it.counted_qty = Number(v); it.divergencia = Number(v) - Number(it.expected_qty);
        it.impacto_valor = it.divergencia * Number(it.custo_unitario);
        it.reason_id = tr.querySelector('.rsn').value || null;
        it.observacao = tr.querySelector('.obs').value || null;
        toast('Contagem registrada.'); draw();
      };
    });
  };
  draw();
  ['q','fl','cego'].forEach(id => on('#'+id, id==='q'?'input':'change', draw));

  on('#exp','click', () => toXlsx(itens.map(i=>({Codigo:i.sku,Descricao:i.descricao,Lote:i.numero_lote,
    Esperado:i.expected_qty,Contado:i.counted_qty,Divergencia:i.divergencia,
    CustoUnit:i.custo_unitario,ImpactoRS:i.impacto_valor,Motivo:i.motivo,Observacao:i.observacao,
    ContadoPor:i.contado_por})), `${inv.codigo}.xlsx`));

  on('#addLotes','click', async () => {
    const jaTem = new Set(itens.map(i=>i.lot_id));
    const lotes = (await rpcAll('fn_lotes_para_inventario', { p_apenas_com_saldo:false }))
      .filter(l => !jaTem.has(l.lot_id));
    if(!lotes.length) return toast('Todos os lotes já estão neste inventário.', 'err');
    abrirSeletorDeLotes({
      titulo: `Acrescentar lotes — ${inv.codigo}`,
      lotes,
      rodape: `<div class="hint" style="margin:10px 0 0">O saldo esperado destes lotes será congelado
        no mesmo corte da abertura (${dts(inv.data_hora_corte)}), para todos os itens do inventário
        serem comparados contra o mesmo instante.</div>`,
      rotuloBotao: 'Acrescentar ao inventário',
      acao: async (m, escolhidos) => {
        if(!escolhidos.length){ toast('Escolha pelo menos um lote.', 'err'); return false; }
        const { data:qtd, error } = await sb.rpc('fn_add_inventory_items', {
          p_inventory: invId, p_lots: escolhidos });
        if(error){ err(error); return false; }
        toast(`${nf(qtd)} lote(s) acrescentado(s).`); route();
        return true;
      }
    });
  });

  on('#cancelar','click', () => {
    const m = modal('Cancelar inventário', `
      <div class="hint">Cancelar não gera ajuste nenhum: o saldo fica exatamente como está.
      O inventário continua visível no histórico, marcado como cancelado, com o motivo — é assim que
      um engano na seleção dos itens não obriga você a fechar um ciclo que não queria abrir.</div>
      <div class="fld"><label>Motivo do cancelamento</label>
        <input id="mt" placeholder="ex.: selecionei os produtos errados"></div>
      <button class="btn dg" id="ok">Cancelar inventário</button>`);
    m.querySelector('#ok').onclick = async () => {
      const mt = m.querySelector('#mt').value.trim();
      if(!mt) return toast('Informe o motivo.','err');
      const { error } = await sb.rpc('fn_cancel_inventory', { p_inventory:invId, p_motivo:mt });
      if(error) return err(error);
      m.remove(); toast('Inventário cancelado.'); location.hash = 'inventario';
    };
  });

  on('#aprovar','click', () => {
    const contados = itens.filter(i=>i.counted_qty!==null);
    const divs = contados.filter(i=>Number(i.divergencia)!==0);
    const semMotivo = divs.filter(i=>!i.reason_id);
    const impacto = divs.reduce((a,i)=>a+Number(i.impacto_valor),0);
    const m = modal('Aprovar inventário', `
      <div class="hint">A aprovação grava os ajustes no razão. A partir daí eles não podem ser apagados —
      só estornados, com motivo e registro em auditoria.</div>
      <div class="cards">
        <div class="card"><div class="lb">Itens contados</div><div class="vl">${nf(contados.length)}</div>
          <div class="ft">${nf(itens.length-contados.length)} não contados serão ignorados</div></div>
        <div class="card ${divs.length?'bad':'ok'}"><div class="lb">Ajustes a gerar</div><div class="vl">${nf(divs.length)}</div></div>
        <div class="card ${impacto<0?'bad':'warn'}"><div class="lb">Impacto</div>
          <div class="vl" style="font-size:19px">${money(impacto)}</div></div>
      </div>
      ${semMotivo.length?`<div class="msg err" style="display:block">${nf(semMotivo.length)} divergência(s) sem motivo.
        Todo ajuste precisa de motivo — volte e preencha antes de aprovar.</div>`:''}
      ${contados.length===0?`<div class="msg err" style="display:block">Nenhum item foi contado.</div>`:''}
      <button class="btn" id="ok" ${(semMotivo.length||!contados.length)?'disabled':''}>Aprovar e gerar ajustes</button>`);
    m.querySelector('#ok').onclick = async () => {
      m.querySelector('#ok').disabled = true;
      const { data, error } = await sb.rpc('fn_approve_inventory', { p_inventory:invId });
      if(error){ err(error); m.querySelector('#ok').disabled=false; return; }
      m.remove();
      toast(`Inventário aprovado: ${data.ajustes_gerados} ajuste(s), impacto ${money(data.impacto_total)}.`);
      route();
    };
  });
}

/* =========================================================
   AJUSTES — quantos, de quanto e por quê
   ========================================================= */
ROUTES.ajustes = async () => {
  const de = new Date(); de.setMonth(de.getMonth()-11); de.setDate(1);
  const data = await fetchAll(() => sb.from('v_ajustes').select('*')
    .gte('movement_date', de.toISOString().slice(0,10)).order('movement_date',{ascending:false}));

  const mesAtual = new Date().toISOString().slice(0,7);
  const doMes = data.filter(a => a.movement_date.slice(0,7) === mesAtual);
  const pos = doMes.filter(a=>a.sinal>0 && !a.eh_sucata), neg = doMes.filter(a=>a.sinal<0 && !a.eh_sucata);
  const suc = doMes.filter(a=>a.eh_sucata);
  // o balanço vem do banco, para dashboard e esta tela nunca discordarem
  const balMeses = await sb.rpc('fn_balanco_ajustes', { p_meses: 12 }).then(r => r.data || []);
  const bal = balMeses[0] || { positivos:0, negativos:0, sucata:0, liquido:0 };

  const porMotivo = {}; data.forEach(a => {
    const k=a.motivo; porMotivo[k] = porMotivo[k] || {qtd:0, valor:0, itens:0};
    porMotivo[k].qtd += Math.abs(Number(a.quantidade));
    porMotivo[k].valor += Number(a.valor_custo);
    porMotivo[k].itens++;
  });
  const porMes = {}; data.forEach(a => {
    const k=a.mes; porMes[k] = porMes[k] || {qtd:0, pos:0, neg:0};
    porMes[k].qtd++; if(a.sinal>0) porMes[k].pos += Number(a.valor_custo); else porMes[k].neg += Number(a.valor_custo);
  });
  const meses = Object.keys(porMes).sort();

  $('#view').innerHTML = header('Ajustes de estoque',
    'Quantos ajustes, de quanto e por quê. A tendência importa mais que o número absoluto: ajuste subindo é processo piorando.',
    `<button class="btn gh sm" id="exp">Exportar Excel</button>`) + `
  <div class="cards">
    <div class="card"><div class="lb">Ajustes no mês</div><div class="vl">${nf(doMes.length)}</div>
      <div class="ft">${nf(pos.length)} positivos · ${nf(neg.length)} negativos</div></div>
    <div class="card bad"><div class="lb">Ajustes negativos</div><div class="vl" style="font-size:19px">${money(bal.negativos)}</div>
      <div class="ft">faltou no chão · sem sucata</div></div>
    <div class="card warn"><div class="lb">Ajustes positivos</div><div class="vl" style="font-size:19px">${money(bal.positivos)}</div>
      <div class="ft">sobrou no chão · sem sucata</div></div>
    <div class="card info"><div class="lb">Sucata no mês</div><div class="vl" style="font-size:19px">${money(bal.sucata)}</div>
      <div class="ft">líquida de correções · <a style="cursor:pointer" onclick="location.hash='sucata'">ver indicador</a></div></div>
    <div class="card ${Number(bal.liquido)<0?'bad':'ok'}"><div class="lb">Resultado do mês</div>
      <div class="vl" style="font-size:19px">${money(bal.liquido)}</div>
      <div class="ft">positivos − negativos − sucata</div></div>
    <div class="card"><div class="lb">Ajustes em 12 meses</div><div class="vl">${nf(data.length)}</div></div>
  </div>
  ${data.length ? `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px">
    <div class="panel" style="margin:0"><div class="ph"><h3>Ajustes por mês</h3></div>
      <div class="pb"><div class="chartbox"><canvas id="c1"></canvas></div></div></div>
    <div class="panel" style="margin:0"><div class="ph"><h3>Valor por motivo</h3></div>
      <div class="pb"><div class="chartbox"><canvas id="c2"></canvas></div></div></div>
  </div>
  <div class="panel"><div class="ph"><h3>Balanço mês a mês</h3>
    <span class="sub">os três baldes não se sobrepõem — dá para somar sem contar duas vezes</span></div>
    <div class="pb flush"><table>
    <thead><tr><th>Mês</th><th class="num">Positivos</th><th class="num">Negativos</th>
      <th class="num">Sucata</th><th class="num">Resultado</th><th class="num">Lançamentos</th></tr></thead>
    <tbody>${balMeses.map(b=>`<tr>
      <td>${dt(b.mes).slice(3)}</td>
      <td class="num pos">${money(b.positivos)}</td>
      <td class="num neg">${money(b.negativos)}</td>
      <td class="num">${money(b.sucata)}</td>
      <td class="num ${Number(b.liquido)<0?'neg':'pos'}"><b>${money(b.liquido)}</b></td>
      <td class="num mut">${nf(Number(b.n_positivos)+Number(b.n_negativos)+Number(b.n_sucata))}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="pb" style="font-size:11.5px;color:var(--tx3);border-top:1px solid var(--line)">
      <b>Resultado = positivos − negativos − sucata.</b> A sucata sai do balde de negativos de propósito: é perda
      conhecida, que vira dinheiro de volta na venda do retalho. Cuidado ao conferir por fora: se somar a sucata
      outra vez em cima dos negativos de cada inventário, ela entra duas vezes e o resultado sai menor do que é.</div>
  </div>

  <div class="panel"><div class="ph"><h3>Por motivo</h3><span class="sub">últimos 12 meses</span></div>
    <div class="pb flush"><table>
    <thead><tr><th>Motivo</th><th class="num">Ocorrências</th><th class="num">Quantidade</th><th class="num">Valor</th></tr></thead>
    <tbody>${Object.entries(porMotivo).sort((a,b)=>b[1].itens-a[1].itens).map(([k,v])=>`<tr>
      <td>${esc(k)}</td><td class="num">${nf(v.itens)}</td><td class="num">${nf(v.qtd)}</td>
      <td class="num ${sgn(v.valor)}">${money(v.valor)}</td></tr>`).join('')}</tbody>
    </table></div></div>` : ''}
  <div class="panel"><div class="ph"><h3>Lançamentos</h3></div><div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Data</th><th>Código</th><th>Descrição</th><th>Lote</th><th>Tipo</th>
      <th class="num">Quantidade</th><th class="num">Valor</th><th>Motivo</th><th>Documento</th><th>Usuário</th><th></th></tr></thead>
    <tbody>${data.length ? data.slice(0,600).map(a=>`<tr>
      <td>${dt(a.movement_date)}</td><td class="mono">${esc(a.sku)}</td><td>${esc(a.descricao)}</td>
      <td class="mono">${esc(a.numero_lote||'—')}</td>
      <td><span class="tag ${a.eh_sucata?'t-info':a.sinal>0?'t-warn':'t-bad'}">${a.eh_sucata?'sucata':a.sinal>0?'positivo':'negativo'}</span></td>
      <td class="num ${sgn(a.sinal)}">${a.sinal>0?'+':'−'}${nf(a.quantidade)}</td>
      <td class="num ${sgn(a.sinal)}">${money(a.valor_custo)}</td>
      <td>${esc(a.motivo)}</td><td class="mono">${esc(a.documento||'—')}</td><td>${esc(a.usuario||'—')}</td>
      <td>${can('admin','auditor') && !/Correção de ajuste/.test(a.motivo||'')
        ? `<button class="btn sm gh" onclick="corrigirAjuste('${a.id}',${a.quantidade},'${esc(a.motivo||'')}',${a.quantidade})">Corrigir</button>` : ''}</td>
    </tr>`).join('') : '<tr><td colspan="11" class="empty">Nenhum ajuste registrado. Ajustes nascem da aprovação de um inventário.</td></tr>'}</tbody>
  </table></div></div></div>`;

  on('#exp','click', () => toXlsx(data.map(a=>({Data:a.movement_date,Codigo:a.sku,Descricao:a.descricao,
    Lote:a.numero_lote,Tipo:a.sinal>0?'POSITIVO':'NEGATIVO',Quantidade:a.qtd_ajustada,
    Valor:a.valor_ajustado,Motivo:a.motivo,Documento:a.documento,Usuario:a.usuario})), 'ajustes.xlsx'));

  if(!data.length) return;
  const eixo = { ticks:{color:'#8b98a9'}, grid:{color:'#242e3b'} };
  const bm = [...balMeses].reverse();   // do mais antigo para o mais novo
  new Chart($('#c1'), { type:'bar',
    data:{ labels: bm.map(b=>dt(b.mes).slice(3)), datasets:[
      { label:'Positivos', data: bm.map(b=>Number(b.positivos)), backgroundColor:'#d29922' },
      { label:'Negativos', data: bm.map(b=>Number(b.negativos)), backgroundColor:'#f85149' },
      { label:'Sucata',    data: bm.map(b=>Number(b.sucata)),    backgroundColor:'#a371f7' }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#8b98a9'}}},
      scales:{ x:{...eixo, stacked:true}, y:{...eixo, stacked:true} } } });
  const mot = Object.entries(porMotivo).sort((a,b)=>Math.abs(b[1].valor)-Math.abs(a[1].valor)).slice(0,8);
  new Chart($('#c2'), { type:'bar',
    data:{ labels: mot.map(m=>m[0]), datasets:[{ label:'Valor R$',
      data: mot.map(m=>Math.abs(m[1].valor)), backgroundColor:'#4a9eff' }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}}, scales:{ x:eixo, y:eixo } } });
};


/* =========================================================
   SUCATA — bobina morta. Não é perda: é retalho de corte que volta a virar
   dinheiro. Medir à parte evita inflar o prejuízo e esconder o desvio real.
   ========================================================= */
ROUTES.sucata = async () => {
  const [serie, porProduto] = await Promise.all([
    sb.rpc('fn_sucata', { p_meses:12 }).then(r => r.data || []),
    rpcAll('fn_sucata_por_produto', { p_meses:12 })
  ]);

  const mesAtual = serie[serie.length-1] || {};
  const total = serie.reduce((a,m)=>a+Number(m.qtd_sucata||0),0);
  const valorTotal = serie.reduce((a,m)=>a+Number(m.valor_sucata||0),0);
  const saidasTotal = serie.reduce((a,m)=>a+Number(m.qtd_saida||0),0);
  const taxaMedia = saidasTotal ? (total / saidasTotal * 100) : null;
  const comDados = serie.filter(m => Number(m.qtd_saida||0) > 0 && m.taxa_percentual !== null);
  const ultimos3 = comDados.slice(-3), anteriores = comDados.slice(-6,-3);
  const media = arr => arr.length ? arr.reduce((a,m)=>a+Number(m.taxa_percentual),0)/arr.length : null;
  const tendencia = (media(ultimos3) !== null && media(anteriores) !== null)
    ? media(ultimos3) - media(anteriores) : null;

  $('#view').innerHTML = header('Sucata — bobina morta',
    'Retalho de corte que vai para sucata e volta a virar dinheiro. É subproduto esperado, não perda — por isso fica fora do indicador de perdas e tem medida própria.',
    `<button class="btn gh sm" id="exp">Exportar Excel</button>`) + `
  <div class="cards">
    <div class="card info"><div class="lb">Sucata no mês</div><div class="vl">${nf(mesAtual.qtd_sucata)}</div>
      <div class="ft">${money(mesAtual.valor_sucata)} a custo</div></div>
    <div class="card"><div class="lb">Taxa do mês</div>
      <div class="vl">${mesAtual.taxa_percentual===null||mesAtual.taxa_percentual===undefined?'—':nf(mesAtual.taxa_percentual,2)+'%'}</div>
      <div class="ft">sobre o que saiu no mês</div></div>
    <div class="card"><div class="lb">Taxa média 12 meses</div>
      <div class="vl">${taxaMedia===null?'—':nf(taxaMedia,2)+'%'}</div>
      <div class="ft">referência de comparação</div></div>
    <div class="card ${tendencia===null?'':tendencia>0.05?'bad':tendencia<-0.05?'ok':''}">
      <div class="lb">Tendência</div>
      <div class="vl" style="font-size:19px">${tendencia===null?'—':(tendencia>0?'+':'')+nf(tendencia,2)+' p.p.'}</div>
      <div class="ft">últimos 3 meses x 3 anteriores</div></div>
    <div class="card"><div class="lb">Acumulado 12 meses</div><div class="vl" style="font-size:19px">${nf(total)}</div>
      <div class="ft">${money(valorTotal)} a custo</div></div>
  </div>

  <div class="hint"><b>Por que a taxa importa mais que a quantidade:</b> a quantidade de sucata sobe naturalmente
  quando você vende mais. A taxa — quanto de retalho para cada 100 que saem — não depende do volume, então é ela
  que mostra se o corte está piorando. Taxa subindo com quantidade estável costuma apontar bobina mal dimensionada
  para o pedido, corte sem planejamento de sobra, ou ponta danificada.</div>

  <div class="panel"><div class="ph"><h3>Evolução mensal</h3>
    <span class="sub">quantidade em barras, taxa em linha</span></div>
    <div class="pb">${serie.some(m=>Number(m.qtd_sucata)>0)
      ? '<div class="chartbox"><canvas id="sc1"></canvas></div>'
      : '<div class="empty">Nenhuma sucata registrada ainda. Ela nasce do inventário: conte o lote e use o motivo <b>Sucata — bobina morta</b>.</div>'}</div></div>

  <div class="panel"><div class="ph"><h3>Por mês</h3></div><div class="pb flush"><table>
    <thead><tr><th>Mês</th><th class="num">Sucata</th><th class="num">Valor</th>
      <th class="num">Ocorrências</th><th class="num">Saídas do mês</th><th class="num">Taxa</th></tr></thead>
    <tbody>${serie.map(m=>`<tr>
      <td>${dt(m.mes).slice(3)}</td>
      <td class="num">${nf(m.qtd_sucata)}</td><td class="num">${money(m.valor_sucata)}</td>
      <td class="num">${nf(m.ocorrencias)}</td><td class="num">${nf(m.qtd_saida)}</td>
      <td class="num">${m.taxa_percentual===null?'—':nf(m.taxa_percentual,2)+'%'}</td>
    </tr>`).join('')}</tbody></table></div></div>

  <div class="panel"><div class="ph"><h3>Onde a sucata se concentra</h3>
    <span class="sub">12 meses, por produto</span></div>
    <div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Código</th><th>Descrição</th><th class="num">Sucata</th><th class="num">Valor</th>
      <th class="num">Ocorrências</th><th class="num">Saídas</th><th class="num">Taxa</th></tr></thead>
    <tbody>${porProduto.length ? porProduto.map(p=>`<tr>
      <td class="mono"><a style="cursor:pointer" onclick="location.hash='produto?id=${p.product_id}'">${esc(p.sku)}</a></td>
      <td>${esc(p.descricao)}</td>
      <td class="num">${nf(p.qtd_sucata)} ${esc(p.unidade)}</td><td class="num">${money(p.valor_sucata)}</td>
      <td class="num">${nf(p.ocorrencias)}</td><td class="num">${nf(p.qtd_saida)}</td>
      <td class="num ${p.taxa_percentual>5?'neg':''}">${p.taxa_percentual===null?'—':nf(p.taxa_percentual,2)+'%'}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty">Nenhum produto com sucata no período.</td></tr>'}</tbody>
    </table></div></div></div>`;

  on('#exp','click', () => toXlsx(porProduto.map(p=>({Codigo:p.sku,Descricao:p.descricao,
    Sucata:p.qtd_sucata,Unidade:p.unidade,Valor:p.valor_sucata,Ocorrencias:p.ocorrencias,
    SaidasNoPeriodo:p.qtd_saida,TaxaPercentual:p.taxa_percentual})), 'sucata-por-produto.xlsx'));

  if(serie.some(m=>Number(m.qtd_sucata)>0)){
    const eixo = { ticks:{color:'#8b98a9'}, grid:{color:'#242e3b'} };
    new Chart($('#sc1'), {
      data:{ labels: serie.map(m=>dt(m.mes).slice(3)), datasets:[
        { type:'bar', label:'Sucata', data: serie.map(m=>Number(m.qtd_sucata)),
          backgroundColor:'#a371f7', yAxisID:'y' },
        { type:'line', label:'Taxa %', data: serie.map(m=>m.taxa_percentual===null?null:Number(m.taxa_percentual)),
          borderColor:'#d29922', tension:.25, yAxisID:'y1', spanGaps:true }]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#8b98a9' } } },
        scales:{ x:eixo, y:eixo, y1:{ position:'right', ticks:{color:'#8b98a9'}, grid:{display:false} } } } });
  }
};


/* =========================================================
   SALDOS NEGATIVOS — correção de lançamento em lote errado.
   Saldo negativo quase nunca significa material faltando: significa que a
   saída foi baixada de um lote onde a entrada nunca foi lançada. O conserto
   é realocar entre lotes, não ajustar — ajuste criaria perda falsa de um lado
   e sobra falsa do outro, e os dois entrariam nos indicadores.
   ========================================================= */
ROUTES.negativos = async () => {
  const [neg, causas] = await Promise.all([
    rpcAll('fn_saldos_negativos'),
    sb.rpc('fn_causas_negativos', { p_meses: 6 }).then(r => r.data || [])
  ]);
  const resolvivel = neg.filter(n => Number(n.saldo_disponivel_no_produto) >= Math.abs(Number(n.saldo)));
  const semLastro = neg.filter(n => Number(n.saldo_produto) < 0);
  const valorTotal = neg.reduce((a,n)=>a+Math.abs(Number(n.valor||0)),0);

  $('#view').innerHTML = header('Saldos negativos',
    'Saldo negativo é quase sempre erro de lançamento, não material sumido. Clique em Corrigir e diga o que aconteceu: o sistema leva ao conserto certo para aquela causa e registra o motivo — é assim que dá para medir onde o erro nasce.',
    `<button class="btn gh sm" id="exp">Exportar Excel</button>`) + `
  <div class="cards">
    <div class="card ${neg.length?'bad':'ok'}"><div class="lb">Lotes negativos</div><div class="vl">${nf(neg.length)}</div></div>
    <div class="card"><div class="lb">Valor envolvido</div><div class="vl" style="font-size:19px">${money(valorTotal)}</div></div>
    <div class="card ok"><div class="lb">Resolvíveis por realocação</div><div class="vl">${nf(resolvivel.length)}</div>
      <div class="ft">o material está em outro lote do mesmo produto</div></div>
    <div class="card ${semLastro.length?'bad':''}"><div class="lb">Produto todo negativo</div><div class="vl">${nf(semLastro.length)}</div>
      <div class="ft">aí falta entrada, não é só lote trocado</div></div>
  </div>

  ${semLastro.length?`<div class="hint"><b>Atenção nos ${nf(semLastro.length)} com o produto inteiro negativo.</b>
    Nesses, somando todos os lotes o saldo ainda fica abaixo de zero — então não é lote trocado: falta uma
    entrada que nunca foi importada, ou uma saída foi lançada em duplicidade. Realocar não resolve;
    procure a nota de entrada que faltou.</div>`:''}

  ${causas.length?`<div class="panel"><div class="ph"><h3>Por que ficaram negativos — últimos 6 meses</h3>
    <span class="tag t-mut">${nf(causas.reduce((a,c)=>a+Number(c.ocorrencias),0))} correções</span></div>
    <div class="pb flush"><table><thead><tr><th>Causa declarada</th><th class="num">Ocorrências</th>
      <th>Conserto usado</th><th>Última</th></tr></thead>
    <tbody>${causas.map(c=>`<tr><td>${esc(c.causa)}</td><td class="num"><b>${nf(c.ocorrencias)}</b></td>
      <td class="mut">${esc({realocacao:'realocação entre lotes',correcao_ajuste:'correção de ajuste',
        cancelamento:'cancelamento da nota',devolucao:'devolução',lancamento_manual:'lançamento manual'}[c.ferramenta]||c.ferramenta||'—')}</td>
      <td>${dt(c.ultima)}</td></tr>`).join('')}</tbody></table></div>
    <div class="pb" style="font-size:11.5px;color:var(--tx3);border-top:1px solid var(--line)">Contagem por causa que você declarou ao corrigir. É esta tabela que diz se o problema está no
      recebimento, no inventário ou no faturamento — e se está melhorando.</div></div>`:''}

  <div class="panel"><div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Código</th><th>Descrição</th><th>Lote</th><th class="num">Saldo</th>
      <th class="num">Valor</th><th class="num">Outros lotes</th><th class="num">Disponível no produto</th>
      <th class="num">Saldo do produto</th><th>Saídas</th><th></th></tr></thead>
    <tbody>${neg.length ? neg.map(n=>{
      const falta = Math.abs(Number(n.saldo));
      const cobre = Number(n.saldo_disponivel_no_produto) >= falta;
      return `<tr>
      <td class="mono"><a style="cursor:pointer" onclick="location.hash='produto?id=${n.product_id}'">${esc(n.sku)}</a></td>
      <td>${esc(n.descricao)}</td><td class="mono">${esc(n.numero_lote)}</td>
      <td class="num neg"><b>${nf(n.saldo)}</b></td>
      <td class="num neg">${money(n.valor)}</td>
      <td class="num">${nf(n.irmaos_com_saldo)}</td>
      <td class="num ${cobre?'pos':'neg'}">${nf(n.saldo_disponivel_no_produto)}</td>
      <td class="num ${Number(n.saldo_produto)<0?'neg':''}">${nf(n.saldo_produto)}</td>
      <td style="font-size:11.5px">${n.primeira_saida?`${dt(n.primeira_saida)} a ${dt(n.ultima_saida)}`:'—'}</td>
      <td>${can('admin','auditor') ? (cobre
        ? `<button class="btn sm" onclick="corrigirNegativo('${n.lot_id}','${n.product_id}','${esc(n.sku)}','${esc(n.numero_lote)}',${falta},'${esc(n.unidade||'')}')">Corrigir</button>`
        : `<button class="btn sm gh" onclick="corrigirNegativo('${n.lot_id}','${n.product_id}','${esc(n.sku)}','${esc(n.numero_lote)}',${falta},'${esc(n.unidade||'')}')">Ver lotes</button>`) : ''}</td>
    </tr>`;}).join('') : '<tr><td colspan="10" class="empty">Nenhum saldo negativo. </td></tr>'}</tbody>
  </table></div></div></div>`;

  on('#exp','click', () => toXlsx(neg.map(n=>({Codigo:n.sku,Descricao:n.descricao,Lote:n.numero_lote,
    Saldo:n.saldo,Valor:n.valor,OutrosLotesComSaldo:n.irmaos_com_saldo,
    DisponivelNoProduto:n.saldo_disponivel_no_produto,SaldoDoProduto:n.saldo_produto,
    PrimeiraSaida:n.primeira_saida,UltimaSaida:n.ultima_saida})), 'saldos-negativos.xlsx'));
};

/* Causa declarada da correção. O sistema já registrava QUAL ferramenta foi usada;
   isto registra POR QUE — é o que permite medir se o problema é lote errado no
   recebimento, ajuste feito fora de hora, nota cancelada ou devolução atrasada.
   Só grava depois que a correção deu certo: navegar pelas opções não polui o dado. */
window.__causaNeg = null;
async function registrarCausaNeg(ferramenta, detalhe){
  const c = window.__causaNeg; window.__causaNeg = null;
  if(!c || !c.lot) return;
  try {
    await sb.rpc('fn_registrar_causa_negativo', {
      p_lot: c.lot, p_causa: c.causa, p_ferramenta: ferramenta, p_detalhe: detalhe || c.detalhe || null });
  } catch(e){ /* nunca derruba a correção por causa do registro da causa */ }
}

/* Correção do negativo — guiada pela causa, não pela ferramenta.
   As quatro causas abaixo são as que apareceram de verdade na operação. Cada uma
   tem um conserto diferente, e usar o conserto errado suja o dado: realocar quando
   o caso era ajuste a maior inventa sobra num lote e some com a sucata do mês. */
window.corrigirNegativo = async (lotDestino, productId, sku, numeroLote, falta, unidade) => {
  const [lotes, diag] = await Promise.all([
    sb.rpc('fn_lotes_do_produto', { p_product: productId }).then(r => r.data || []),
    sb.rpc('fn_diagnostico_negativo', { p_lot: lotDestino }).then(r => r.data || {})
  ]);
  const comSaldo   = lotes.filter(l => Number(l.saldo) > 0);
  const disponivel = comSaldo.reduce((a,l) => a + Number(l.saldo), 0);
  const ajustes    = (diag.ajustes || []).filter(a => Number(a.quantidade) - Number(a.ja_corrigido) > 0);
  const saidas     = (diag.saidas  || []);
  const saidasAbertas = saidas.filter(s => Number(s.quantidade) - Number(s.ja_revertido) > 0);
  const suspeitaAjuste = ajustes.length > 0 && Number(diag.saidas_apos_ajuste || 0) > 0;

  const CAUSAS = [
    { id:'lote_errado', tit:'Lançaram com o lote errado',
      lbl:'Lote errado no recebimento',
      txt:'A entrada foi lançada com outro número de lote — genérico, digitado errado, ou o lote que veio da matriz não foi respeitado. O material está aqui, com outro nome.',
      cons:'Realocar entre lotes — o saldo do produto não muda.',
      ok: disponivel >= falta, rec: disponivel >= falta && !suspeitaAjuste,
      bloq:'Nenhum outro lote deste produto tem saldo para trazer.' },
    { id:'ajuste_antes', tit:'Ajuste de inventário lançado antes das saídas',
      lbl:'Ajuste antes de lançar as saídas',
      txt:'O inventário foi aprovado antes de importar as saídas do dia. A baixa que ainda não estava no sistema entrou na conta do ajuste e depois entrou de novo como saída.',
      cons:'Corrigir o ajuste — o indicador (sucata, perda) volta ao número real.',
      ok: ajustes.length > 0, rec: suspeitaAjuste,
      bloq:'Este lote não tem ajuste de inventário pendente de correção.' },
    { id:'nota_cancelada', tit:'A nota de saída foi cancelada',
      lbl:'Nota de saída cancelada',
      txt:'A saída chegou pelo arquivo, mas a nota foi cancelada depois. O material nunca saiu.',
      cons:'Cancelar a nota — a saída continua no Kardex, com a entrada ligada a ela.',
      ok: saidasAbertas.length > 0, rec:false,
      bloq:'Este lote não tem saída em aberto para cancelar.' },
    { id:'devolucao', tit:'Houve devolução que não foi lançada',
      lbl:'Devolução lançada depois',
      txt:'O cliente devolveu e a entrada da devolução ainda não entrou no sistema.',
      cons:'Lançar a devolução sobre a saída — ou manualmente, se a venda é anterior ao Marco Zero.',
      ok:true, rec:false, bloq:'' }
  ];

  const btnCausa = c => `
    <div class="cnOpt${c.ok?'':' off'}" data-c="${c.id}" ${c.ok?'':'title="'+esc(c.bloq)+'"'}>
      <div class="cnT">${esc(c.tit)} ${c.rec?'<span class="tag t-ok" style="margin-left:6px">provável</span>':''}</div>
      <div class="cnD">${esc(c.txt)}</div>
      <div class="cnC">${c.ok ? '→ ' + esc(c.cons) : '<span class="neg">'+esc(c.bloq)+'</span>'}</div>
    </div>`;

  const m = modal(`Corrigir saldo negativo — ${sku}`, `
    <style>
      .cnOpt{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.12s}
      .cnOpt:hover{border-color:var(--ac);background:rgba(255,255,255,.02)}
      .cnOpt.sel{border-color:var(--ac);background:rgba(74,158,255,.09)}
      .cnOpt.off{opacity:.42;cursor:not-allowed}
      .cnOpt.off:hover{border-color:var(--line);background:none}
      .cnT{font-weight:600;font-size:13.5px}
      .cnD{font-size:12px;color:var(--tx2);margin-top:3px;line-height:1.45}
      .cnC{font-size:11.5px;color:var(--tx3);margin-top:5px}
      .cnLinha{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
      .cnLinha:last-child{border-bottom:0}
      .cnLinha .cresce{flex:1}
    </style>
    <dl class="kv" style="margin-bottom:14px">
      <dt>Lote</dt><dd class="mono">${esc(numeroLote)}${diag.lote_generico?' <span class="tag t-warn">genérico</span>':''}</dd>
      <dt>Falta</dt><dd class="neg"><b>−${nf(falta)} ${esc(unidade)}</b></dd>
      <dt>Outros lotes do produto</dt><dd>${comSaldo.length ? `${nf(disponivel)} disponível em ${comSaldo.length} lote(s)` : 'nenhum com saldo'}</dd>
    </dl>
    ${diag.lote_generico ? `<div class="hint">Este é um lote genérico. Quando a entrada é lançada em genérico por pressa, o rastro do lote real se perde — vale conferir com quem recebeu antes de corrigir.</div>`:''}
    <div style="font-weight:600;margin:4px 0 9px">O que aconteceu com este lote?</div>
    ${CAUSAS.map(btnCausa).join('')}
    <div id="cnPainel" style="margin-top:14px"></div>`, true);

  const $$ = q => m.querySelector(q);

  /* ---- painel A: realocação ---- */
  const painelRealoc = () => {
    $$('#cnPainel').innerHTML = `
      <div class="hint">Traga a quantidade do lote que realmente recebeu o material: o <b>saldo total do produto
      não muda</b>, e nada entra em perdas, sucata ou consumo. Fica registrado nos dois lotes, com seu nome e o motivo.</div>
      <div class="fld"><label>De qual lote veio o material</label>
        <select id="rlOrig">${comSaldo.map(l =>
          `<option value="${l.lot_id}" data-saldo="${l.saldo}" data-lote="${esc(l.numero_lote)}">${esc(l.numero_lote)} — saldo ${nf(l.saldo)}</option>`).join('')}
        </select>
        <div id="rlInfo" style="font-size:11.5px;color:var(--tx3);margin-top:4px"></div></div>
      <div class="filters">
        <div class="fld"><label>Quantidade a trazer</label>
          <input id="rlQtd" type="number" step="0.0001" value="${Math.min(falta, Number(comSaldo[0].saldo))}">
          <div style="font-size:11.5px;color:var(--tx3);margin-top:4px">Se um lote sozinho não cobrir a falta,
            traga o que ele tem e repita a correção no próximo.</div></div>
        <div class="fld" style="flex:1;min-width:220px"><label>Detalhe <span style="color:var(--bad)">*</span></label>
          <select id="rlMotivo">
            <option>Entrada lançada em lote genérico</option>
            <option>Número do lote digitado incorretamente</option>
            <option>Lote da transferência da matriz não foi respeitado</option>
            <option>Lote informado pelo fornecedor diferente do físico</option>
            <option>Saída baixada do lote errado</option>
            <option>Outro (descrever na observação)</option>
          </select></div>
      </div>
      <div class="fld"><label>Observação</label>
        <textarea id="rlObs" rows="2" placeholder="quem informou, como foi identificado, número da NF de origem…"></textarea></div>
      <div id="rlPrev" style="margin:12px 0;font-size:13px"></div>
      <button class="btn" id="rlOk">Realocar e corrigir</button>`;

    const prev = () => {
      const q = Number($$('#rlQtd').value||0);
      const opt = $$('#rlOrig').selectedOptions[0];
      const saldoOrig = Number(opt?.dataset.saldo||0);
      $$('#rlInfo').textContent = `Este lote ficará com ${nf(saldoOrig - q)} depois da correção.`;
      $$('#rlPrev').innerHTML = !(q>0) ? ''
        : q > saldoOrig ? `<span class="tag t-bad">o lote de origem só tem ${nf(saldoOrig)}</span>`
        : `<span class="tag t-mut">${esc(opt.dataset.lote)}: ${nf(saldoOrig)} → ${nf(saldoOrig-q)}</span>
           &nbsp;<span class="tag ${(-falta+q)>=0?'t-ok':'t-warn'}">${esc(numeroLote)}: ${nf(-falta)} → ${nf(-falta+q)}</span>`;
      $$('#rlOk').disabled = !(q>0) || q > saldoOrig;
    };
    $$('#rlQtd').oninput = prev;
    $$('#rlOrig').onchange = () => {
      const saldoOrig = Number($$('#rlOrig').selectedOptions[0]?.dataset.saldo||0);
      $$('#rlQtd').value = Math.min(falta, saldoOrig);
      prev();
    };
    prev();

    $$('#rlOk').onclick = async () => {
      const motivo = $$('#rlMotivo').value, obs = $$('#rlObs').value;
      if(motivo.startsWith('Outro') && !obs.trim()) return toast('Descreva o motivo na observação.', 'err');
      $$('#rlOk').disabled = true;
      const { data, error } = await sb.rpc('fn_realocar_lote', {
        p_product: productId, p_lote_origem: $$('#rlOrig').value,
        p_quantidade: Number($$('#rlQtd').value||0),
        p_lote_destino: lotDestino, p_numero_lote_destino: null,
        p_motivo: motivo, p_observacao: obs || null });
      $$('#rlOk').disabled = false;
      if(error) return err(error);
      window.__causaNeg = { lot: lotDestino, causa:'Lote errado no recebimento', detalhe: motivo };
      await registrarCausaNeg('realocacao', motivo);
      m.remove();
      toast(`${nf(data.quantidade)} realocado de ${data.lote_origem} para ${data.lote_destino}. Saldo agora: ${nf(data.saldo_destino)}.`);
      route();
    };
  };

  /* ---- painel B: correção de ajuste ---- */
  const painelAjuste = () => {
    $$('#cnPainel').innerHTML = `
      <div class="hint">Não se apaga o ajuste — lança-se o contrário, com o mesmo motivo. Os dois continuam no
      Kardex e o indicador volta ao número real: se o ajuste lançou 39 de sucata mas 12 tinham saído por venda,
      a sucata do mês passa a contar 27.</div>
      ${ajustes.map(a => `<div class="cnLinha">
        <div class="cresce"><b>${dt(a.movement_date)}</b> · ${esc(a.tipo)} de <b>${nf(a.quantidade)}</b>
          ${a.motivo?`<div style="color:var(--tx3);font-size:11.5px">${esc(a.motivo)}${Number(a.ja_corrigido)>0?` · já corrigido ${nf(a.ja_corrigido)}`:''}</div>`:''}</div>
        <button class="btn sm" data-aj="${a.id}" data-max="${Number(a.quantidade)-Number(a.ja_corrigido)}"
          data-mot="${esc(a.motivo||'')}">Corrigir ajuste</button></div>`).join('')}`;
    $$('#cnPainel').querySelectorAll('[data-aj]').forEach(b => b.onclick = () => {
      window.__causaNeg = { lot: lotDestino, causa:'Ajuste antes de lançar as saídas' };
      corrigirAjuste(b.dataset.aj, Number(b.dataset.max), b.dataset.mot, falta);
    });
  };

  /* ---- painéis C e D: sobre as saídas do lote ---- */
  const painelSaidas = (acao) => {
    const ehDev = acao === 'DEVOLUCAO';
    $$('#cnPainel').innerHTML = `
      <div class="hint">${ehDev
        ? 'A devolução cria uma entrada ligada à saída original — as duas continuam no Kardex e o consumo do mês é abatido. Se a venda é anterior ao Marco Zero, ela não existe no razão: use o lançamento manual no fim desta lista.'
        : 'O cancelamento não apaga a saída: cria a entrada ligada a ela, sobre a mesma nota. O histórico continua auditável.'}</div>
      ${saidasAbertas.length ? saidasAbertas.map(s => `<div class="cnLinha">
        <div class="cresce"><b>${dt(s.movement_date)}</b> · NF <span class="mono">${esc(s.documento||'sem nota')}</span> · ${nf(s.quantidade)} ${esc(unidade)}
          <div style="color:var(--tx3);font-size:11.5px">${esc(s.cliente_nome||'sem cliente')} · ${money(s.valor_custo)}${Number(s.ja_revertido)>0?` · já revertido ${nf(s.ja_revertido)}`:''}</div></div>
        <button class="btn sm ${ehDev?'':'gh'}" data-sd="${s.id}" data-q="${Number(s.quantidade)-Number(s.ja_revertido)}"
          data-doc="${esc(s.documento||'')}">${ehDev?'Lançar devolução':'Cancelar nota'}</button></div>`).join('')
        : `<div class="msg err" style="display:block">Este lote não tem saída em aberto.</div>`}
      ${ehDev ? `<button class="btn gh" id="cnManual" style="margin-top:12px">A venda é anterior ao Marco Zero — lançar manualmente</button>` : ''}`;

    $$('#cnPainel').querySelectorAll('[data-sd]').forEach(b => b.onclick = () => {
      window.__causaNeg = { lot: lotDestino, causa: ehDev ? 'Devolução lançada depois' : 'Nota de saída cancelada',
                            detalhe: `NF ${b.dataset.doc||'sem nota'}` };
      reverter(b.dataset.sd, acao, sku, Number(b.dataset.q), b.dataset.doc);
    });
    const bm = $$('#cnManual');
    if(bm) bm.onclick = () => {
      window.__causaNeg = { lot: lotDestino, causa:'Devolução lançada depois', detalhe:'venda anterior ao Marco Zero' };
      m.remove(); lancamentoManual();
    };
  };

  const PAINEL = { lote_errado: painelRealoc, ajuste_antes: painelAjuste,
                   nota_cancelada: () => painelSaidas('CANCELAMENTO'),
                   devolucao: () => painelSaidas('DEVOLUCAO') };

  m.querySelectorAll('.cnOpt').forEach(o => o.onclick = () => {
    if(o.classList.contains('off')) return;
    m.querySelectorAll('.cnOpt').forEach(x => x.classList.remove('sel'));
    o.classList.add('sel');
    PAINEL[o.dataset.c]();
  });

  const auto = CAUSAS.find(c => c.rec);
  if(auto) m.querySelector(`.cnOpt[data-c="${auto.id}"]`).click();
};
/* Correção de ajuste: quando o inventário foi aprovado antes de importar as
   saídas, o ajuste absorveu uma baixa que depois entrou de novo. Não se apaga
   o ajuste — lança-se o contrário, com o mesmo motivo, para o indicador
   (sucata, perda) voltar ao número real. */
window.corrigirAjuste = (movId, maximo, motivoOriginal, falta) => {
  const sugerido = Math.min(maximo, falta);
  const m = modal('Corrigir ajuste', `
    <div class="hint">Vai ser lançado um ajuste <b>contrário</b>, vinculado ao original e com o mesmo motivo
    (${esc(motivoOriginal||'sem motivo')}). Os dois continuam no Kardex — nada é apagado — e o indicador
    volta ao número real: se o ajuste lançou 39 de sucata mas 12 tinham saído por venda, a sucata do mês
    passa a contar 27.</div>
    <dl class="kv" style="margin-bottom:16px">
      <dt>Ajuste original</dt><dd>${nf(maximo)} ainda sem correção</dd>
      <dt>Rombo do lote</dt><dd class="neg">−${nf(falta)}</dd></dl>
    <div class="fld"><label>Quantidade a corrigir</label>
      <input id="caQtd" type="number" step="0.0001" max="${maximo}" value="${sugerido}">
      <div style="font-size:11.5px;color:var(--tx3);margin-top:4px">
        Sugerido: ${nf(sugerido)} — o que falta para o lote voltar a zero.</div></div>
    <div class="fld"><label>Motivo da correção <span style="color:var(--bad)">*</span></label>
      <select id="caMotivo">
        <option>Inventário aprovado antes de importar as saídas do dia</option>
        <option>Quantidade do ajuste lançada a maior</option>
        <option>Saída contada duas vezes: no ajuste e na nota</option>
        <option>Outro (descrever abaixo)</option>
      </select></div>
    <div class="fld"><label>Observação</label><textarea id="caObs" rows="2" placeholder="opcional"></textarea></div>
    <button class="btn" id="caOk">Lançar correção</button>`);

  m.querySelector('#caOk').onclick = async () => {
    const q = Number(m.querySelector('#caQtd').value||0);
    if(!(q > 0) || q > maximo) return toast(`Informe uma quantidade entre 0 e ${nf(maximo)}.`, 'err');
    const mot = m.querySelector('#caMotivo').value;
    const obs = m.querySelector('#caObs').value;
    if(mot.startsWith('Outro') && !obs.trim()) return toast('Descreva o motivo na observação.', 'err');
    m.querySelector('#caOk').disabled = true;
    const { data, error } = await sb.rpc('fn_corrigir_ajuste', {
      p_movement: movId, p_quantidade: q, p_motivo: obs ? `${mot} — ${obs}` : mot });
    m.querySelector('#caOk').disabled = false;
    if(error) return err(error);
    await registrarCausaNeg('correcao_ajuste', mot);
    m.remove();
    document.querySelectorAll('.modal').forEach(x => x.remove());
    toast(`Correção lançada: o ajuste líquido passou de ${nf(data.ajuste_original)} para ${nf(data.ajuste_liquido)}.`);
    route();
  };
};

ROUTES.config = async () => {
  const [{data:st},{data:al}] = await Promise.all([
    sb.from('system_settings').select('*').order('chave'),
    can('admin') ? sb.from('user_allowlist').select('*').order('email') : Promise.resolve({data:[]})
  ]);
  const adm = can('admin');
  $('#view').innerHTML = header('Configurações','Todos os limites do sistema são parâmetro, não código.') + `
  <div class="panel"><div class="ph"><h3>Parâmetros</h3>${adm?'<span class="sub">clique no valor para editar</span>':''}</div>
  <div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>Chave</th><th>Descrição</th><th class="num">Valor</th></tr></thead>
    <tbody>${(st||[]).map(s=>`<tr><td class="mono">${esc(s.chave)}</td><td>${esc(s.descricao||'')}</td>
      <td class="num">${adm?`<input data-k="${esc(s.chave)}" value="${esc(s.valor)}" style="width:110px;text-align:right;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 8px">`:esc(s.valor)}</td>
    </tr>`).join('')}</tbody></table></div></div></div>

  ${adm?`<div class="panel"><div class="ph"><h3>Quem pode acessar</h3>
    <span class="sub">quem não estiver aqui não enxerga nenhuma linha do sistema</span>
    <button class="btn sm" id="addUser">Autorizar e-mail</button></div>
  <div class="pb flush"><div class="scroll"><table>
    <thead><tr><th>E-mail</th><th>Nome</th><th>Perfil</th><th>Filial</th></tr></thead>
    <tbody>${(al||[]).map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.full_name||'—')}</td>
      <td><span class="tag t-info">${esc(u.role)}</span></td><td>${esc(u.branch_code)}</td></tr>`).join('')}</tbody>
  </table></div></div></div>

  <div class="panel"><div class="ph"><h3>Diagnóstico</h3>
    <span class="sub">para quando algo se comportar de forma estranha</span>
    <button class="btn gh sm" id="copiaDiag">Copiar</button></div>
  <div class="pb"><pre id="diagbox" style="font-size:11.5px;color:var(--tx2);white-space:pre-wrap;
    max-height:260px;overflow:auto;margin:0;font-family:ui-monospace,monospace"></pre></div></div>

  <div class="panel" style="border-color:rgba(248,81,73,.35)"><div class="ph"><h3>Recomeçar do zero</h3>
    <span class="sub">apaga produtos, lotes, movimentos, importações e conciliações</span></div>
  <div class="pb">
    <div class="hint">Use quando a base tiver dados de teste ou de uma importação errada.
    <b>Usuários, motivos, parâmetros e o log de auditoria são preservados</b> — o próprio reset fica registrado no log.</div>
    <button class="btn dg" id="reset">Zerar dados importados</button>
  </div></div>`:''}`;

  {
    const { data:{ session } } = await sb.auth.getSession();
    const txt = [
      `versão            ${VERSAO}`,
      `origem            ${DIAG.origem}`,
      `dentro de iframe  ${DIAG.iframe ? 'SIM  <- a sessão não sobrevive aqui' : 'não'}`,
      `armazenamento     ${DIAG.storage ? 'ok (dentro da página)' : 'BLOQUEADO'}`,
      `persistência      ${DIAG.aberturas > 1 ? 'ok — esta é a abertura nº ' + DIAG.aberturas
        : 'FALHA: cada abertura começa do zero, então todo recarregamento cai no login'}`,
      `sessão ativa      ${session ? 'sim' : 'NÃO'}`,
      `expira em         ${session ? new Date(session.expires_at*1000).toLocaleString('pt-BR') : '—'}`,
      `janela            ${window.innerWidth}x${window.innerHeight}`,
      '',
      'últimos eventos:',
      ...DIAG.eventos.slice(-25).map(e => `  ${e.t}  ${JSON.stringify(e)}`)
    ].join('\n');
    const box = $('#diagbox'); if(box) box.textContent = txt;
    on('#copiaDiag','click', () => { navigator.clipboard?.writeText(txt); toast('Diagnóstico copiado.'); });
  }

  if(adm){
    document.querySelectorAll('[data-k]').forEach(inp => inp.onchange = async () => {
      const { error } = await sb.from('system_settings').update({ valor:Number(inp.value) }).eq('chave',inp.dataset.k);
      error ? err(error) : toast('Parâmetro atualizado.');
    });
    $('#reset').onclick = () => {
      const m = modal('Zerar dados importados', `
        <div class="msg err" style="display:block"><b>Serão apagados:</b> produtos, lotes, movimentações, saldos,
        importações, fotografias do ERP, inventários e conciliações. Não há como desfazer — mas você pode reimportar do ERP.</div>
        <div class="hint" style="margin-bottom:14px"><b>Continuam intactos:</b> parâmetros, motivos de ajuste, usuários autorizados
        e o log de auditoria — que registra também este reset, para a base começar vazia sem perder o histórico de que foi zerada.</div>
        <div class="fld"><label>Digite <b>APAGAR</b> para confirmar</label><input id="c" placeholder="APAGAR"></div>
        <button class="btn dg" id="ok">Zerar agora</button>`);
      m.querySelector('#ok').onclick = async () => {
        const { data, error } = await sb.rpc('fn_reset_dados', { p_confirmacao:m.querySelector('#c').value.trim().toUpperCase() });
        if(error) return err(error);
        m.remove();
        toast(`Base zerada: ${data.produtos} produtos, ${data.lotes} lotes e ${data.movimentos} movimentos removidos.`);
        location.hash = 'importacao';
      };
    };
    $('#addUser').onclick = () => {
      const m = modal('Autorizar acesso', `
        <div class="fld"><label>E-mail</label><input id="e" type="email"></div>
        <div class="fld"><label>Nome</label><input id="n"></div>
        <div class="fld"><label>Perfil</label><select id="r">
          <option value="consulta">Consulta — só visualiza</option>
          <option value="operacional">Operacional — consulta e conta inventário</option>
          <option value="auditor">Auditor — importa, concilia e aprova ajuste</option>
          <option value="admin">Administrador — acesso completo</option></select></div>
        <div class="hint">A pessoa cria a própria senha na tela de login. O perfil é concedido automaticamente no primeiro acesso.</div>
        <button class="btn" id="ok">Autorizar</button>`);
      m.querySelector('#ok').onclick = async () => {
        const { error } = await sb.from('user_allowlist').insert({ email:m.querySelector('#e').value.trim().toLowerCase(),
          full_name:m.querySelector('#n').value, role:m.querySelector('#r').value, branch_code:CFG.filial });
        if(error) return err(error);
        m.remove(); toast('Acesso autorizado.'); route();
      };
    };
  }
};

/* ---------- start ---------- */
/* Cair para o login no meio do trabalho é o pior comportamento possível: o usuário
   perde a tela e não sabe por quê. Antes de expulsar, tento recuperar a sessão.
   Só se a recuperação falhar é que a tela de login aparece — e guardando onde parou. */
let recuperando = false;
async function tratarSessaoPerdida(){
  log({ ev:'sessao_perdida' });
  if(recuperando) return; recuperando = true;
  banner('Reconectando…', 'info');
  try{
    let { data:{ session } } = await sb.auth.getSession();
    if(!session){ const r = await sb.auth.refreshSession(); session = r.data?.session || null; }
    if(session){ banner(null); recuperando = false; return true; }
  }catch(e){ console.warn('falha ao recuperar sessão', e); }
  banner(null); recuperando = false;
  try{ sessionStorage.setItem('rx_volta', location.hash || '#dashboard'); }catch(e){}
  $('#app').style.display='none'; $('#login').style.display='flex';
  $('#lgmsg').className = 'msg err';
  $('#lgmsg').textContent = 'Sua sessão expirou. Entre de novo — você volta para a mesma tela em que estava.';
  return false;
}
sb.auth.onAuthStateChange((ev) => { log({ ev:'auth', evento:ev });
  if(ev === 'SIGNED_OUT') tratarSessaoPerdida(); });

// faixa de aviso no topo, sem tirar a tela do usuário
function banner(msg, tipo='warn'){
  let b = document.getElementById('rxbanner');
  if(!msg){ if(b) b.remove(); return; }
  if(!b){ b = el('<div id="rxbanner"></div>'); document.body.appendChild(b); }
  const cor = tipo==='info' ? 'var(--ac)' : 'var(--warn)';
  b.setAttribute('style', `position:fixed;top:0;left:0;right:0;z-index:300;padding:9px 16px;
    text-align:center;font-size:12.5px;background:var(--panel2);border-bottom:1px solid ${cor};color:${cor}`);
  b.innerHTML = msg;
}

/* Ambiente onde a sessão não sobrevive: painel de pré-visualização (iframe) ou
   navegador sem armazenamento local. Nesses casos o login some a cada navegação e
   parece "bug do sistema" — melhor dizer na cara o que está acontecendo. */
const DIAG = { eventos: [] };
try { DIAG.eventos = JSON.parse(sessionStorage.getItem('rx_diag') || '[]'); } catch(e){}
const log = (o) => {
  DIAG.eventos.push({ t: new Date().toLocaleTimeString('pt-BR'), ...o });
  if(DIAG.eventos.length > 80) DIAG.eventos.shift();
  try { sessionStorage.setItem('rx_diag', JSON.stringify(DIAG.eventos)); } catch(e){}
};
// se a página recarregar, isto aparece no histórico e explica a volta ao login
window.addEventListener('beforeunload', () => log({ ev:'PAGINA_RECARREGOU_OU_FECHOU', tela: location.hash }));
/* Teste real de persistência: no file:// o Chrome costuma isolar o armazenamento a cada
   abertura. O gravar/ler dentro da mesma página funciona, mas nada sobrevive ao reload —
   e aí toda navegação que recarregue a página cai no login. Este contador prova. */
DIAG.aberturas = (() => {
  try { const n = Number(localStorage.getItem('rx_aberturas') || 0) + 1;
        localStorage.setItem('rx_aberturas', n); return n; } catch(e){ return 0; }
})();
DIAG.iframe = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
DIAG.storage = (() => { try { localStorage.setItem('rx_t','1'); localStorage.removeItem('rx_t'); return true; }
                        catch(e){ return false; } })();
DIAG.origem = location.protocol + '//' + (location.host || '(arquivo local)');
log({ ev:'inicio', iframe:DIAG.iframe, storage:DIAG.storage, origem:DIAG.origem });

if(DIAG.iframe || !DIAG.storage){
  setTimeout(() => banner(
    `⚠ <b>Este sistema está rodando dentro de uma janela de pré-visualização</b>, e aí o navegador não guarda a sessão —
     a cada clique você volta para o login. <b>Salve o arquivo no computador e abra com duplo clique</b>
     (Chrome ou Edge). Não é defeito do sistema.`), 400);
}

/* Dois arquivos do sistema abertos ao mesmo tempo compartilham a mesma sessão e brigam
   pela renovação do token — o que derruba os dois. Aviso em vez de deixar acontecer calado. */
try{
  const ch = new BroadcastChannel('raiox-estoque');
  const meuId = Math.random().toString(36).slice(2);
  ch.onmessage = e => {
    if(e.data?.tipo === 'ola' && e.data.id !== meuId){
      banner('⚠ O sistema está aberto em <b>mais de uma aba ou arquivo</b>. Isso derruba a sessão das duas. Feche as outras e recarregue esta.');
      ch.postMessage({ tipo:'ja-estou-aqui', id: meuId });
    }
    if(e.data?.tipo === 'ja-estou-aqui' && e.data.id !== meuId){
      banner('⚠ O sistema já está aberto em outra aba ou arquivo. Feche a outra e recarregue esta — sessões concorrentes se derrubam.');
    }
  };
  ch.postMessage({ tipo:'ola', id: meuId });
}catch(e){ /* navegador sem BroadcastChannel: segue sem o aviso */ }

// erro não tratado vira mensagem na tela, nunca silêncio
window.addEventListener('error', e => {
  console.error(e.error||e.message);
  toast('Erro na tela: ' + (e.message||'desconhecido'), 'err');
});
window.addEventListener('unhandledrejection', e => {
  const m = e.reason?.message || String(e.reason||'');
  console.error(e.reason);
  if(/JWT|token|session/i.test(m)) return tratarSessaoPerdida();
  toast('Falha: ' + m, 'err');
});
boot().catch(err);
</script>
